function home(){if(!club())return `<div class="notice">Bem-vindo ao MiraFoot! Escolha um clube para iniciar sua carreira.</div><button class="primary" data-go="club">Escolher clube</button>`;let next=DB.teams.filter(t=>t.id!==S.clubId)[S.round%Math.max(1,DB.teams.length-1)];return `<h1>${club().name}</h1><div class="grid">${box(`<div class="row"><span>Resumo da temporada</span><span class="pill">OVR ${avg(xi())}</span></div>`, `<div class="stats"><div class="stat"><small>Vitórias</small><b>${S.w}</b></div><div class="stat"><small>Empates</small><b>${S.d}</b></div><div class="stat"><small>Derrotas</small><b>${S.l}</b></div></div><div class="big green">${money(S.cash)}</div><div class="muted">Saldo do clube</div>`,"s7")}
${box("Próxima partida",`<div class="row"><b>${club().name}</b><span class="big">×</span><b>${next?.name||"Adversário"}</b></div><p class="muted">Escalação ativa: ${S.preset} • Duração: ${S.settings?.matchMinutes||5} min</p>${activeMatch?`<div class="notice" id="matchStatus">Partida em andamento...</div><div class="row"><b id="matchClock">${activeMatch.minute}' / 90'</b><span class="muted" id="matchRemaining">${activeMatch.remaining}s restantes</span></div><div style="height:9px;background:#071421;border-radius:9px;overflow:hidden;margin:8px 0 12px"><div id="matchProgress" style="height:100%;width:${activeMatch.minute/90*100}%;background:var(--green)"></div></div><button id="returnMatch" class="primary">Voltar à partida</button> <button id="pauseMatch">${matchPaused?(m.halftime?"Iniciar 2º tempo":"Continuar"):"Pausar"}</button>`:`<button class="primary" id="play">Preparar partida</button>`}`,"s5")}
${box("Últimos resultados",S.log.length?`<table><tbody>${S.log.slice(-6).reverse().map(x=>`<tr><td>${x.home}</td><td><b>${x.score}</b></td><td>${x.away}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">Nenhum jogo disputado.</div>`,"s12")}</div>`}
function clubPage(){let leagues=[...new Set(DB.teams.map(t=>t.league))];return `<h1>Escolha seu clube</h1><div class="grid">${box("Clubes disponíveis",`<div class="field"><label>Competição</label><select id="filter"><option value="">Todas</option>${leagues.map(l=>`<option>${l}</option>`).join("")}</select></div><div class="scroll"><table id="clubs"><tbody>${DB.teams.map(t=>`<tr data-league="${t.league}"><td><b>${t.name}</b><div class="muted tiny">${t.league} • ${t.country}</div></td><td class="right"><span class="pill">Força ${t.strength}</span></td><td class="right"><button data-club="${t.id}">Escolher</button></td></tr>`).join("")}</tbody></table></div>`,"s12")}</div>`}
function selectClub(id,ask=true){let t=team(id);if(!t)return;if(ask&&S.clubId&&!confirm("Trocar de clube? Isso inicia uma nova carreira com o elenco desse clube."))return;S.clubId=id;S.players=DB.players.filter(p=>p.teamId===id).map(p=>({...p}));S.cash= Math.max(8000000,t.strength*1100000);S.round=0;S.w=S.d=S.l=0;S.log=[];S.presets={Titular:[],Reservas:[],Copa:[]};S.preset="Titular";save();page="home";render()}
function formationShape(f){const shapes={"4-3-3":[[50,88],[20,69],[40,73],[60,73],[80,69],[30,49],[50,54],[70,49],[18,24],[50,18],[82,24]],"4-4-2":[[50,88],[20,69],[40,73],[60,73],[80,69],[18,49],[39,52],[61,52],[82,49],[36,22],[64,22]],"4-2-3-1":[[50,88],[20,69],[40,73],[60,73],[80,69],[38,58],[62,58],[18,34],[50,30],[82,34],[50,15]],"3-5-2":[[50,88],[30,72],[50,74],[70,72],[12,48],[32,52],[50,55],[68,52],[88,48],[36,22],[64,22]]};return shapes[f]||shapes["4-3-3"]}
function currentXI(){let ids=S.presets[S.preset]||[];let a=ids.map(id=>S.players.find(p=>p.id===id)).filter(Boolean);if(a.length!==11)a=bestXI(S.players);return a}
function squad(){if(!club())return `<div class="notice">Escolha um clube primeiro.</div>`;let selected=currentXI(),shape=formationShape(S.formation);return `<h1>Elenco e escalação</h1><div class="grid">${box("Quadro tático • escalação titular",`<div class="field"><label>Escalação</label><select id="preset">${Object.keys(S.presets).map(p=>`<option ${S.preset===p?"selected":""}>${p}</option>`).join("")}</select><label>Formação</label><select id="formation">${["4-3-3","4-4-2","4-2-3-1","3-5-2"].map(f=>`<option ${S.formation===f?"selected":""}>${f}</option>`).join("")}</select><button id="saveXI" class="primary">Salvar escalação</button></div><div class="pitch">${selected.map((p,i)=>`<div class="slot" style="left:${shape[i][0]}%;top:${shape[i][1]}%"><b>${["GOL","DEF","DEF","DEF","DEF","MEI","MEI","MEI","ATA","ATA","ATA"][i]}</b><small>${p.name} • OVR ${p.overall}</small><select data-slot="${i}">${S.players.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${x.name} (${x.overall})</option>`).join("")}</select></div>`).join("")}</div><div class="notice">Toque no jogador dentro do campo para trocar a posição. A formação reorganiza os atletas automaticamente.</div>` ,"s7")}${box("Resumo do elenco",`<div class="stats"><div class="stat"><small>Jogadores</small><b>${S.players.length}</b></div><div class="stat"><small>Força titular</small><b>${avg(selected)}</b></div><div class="stat"><small>Formação</small><b>${S.formation}</b></div></div><p class="muted">Escolha o atleta diretamente no campo. Cada escalação pode ser salva separadamente.</p>` ,"s5")}${box("Todos os jogadores",S.players.length?`<div class="scroll"><table><thead><tr><th>Jogador</th><th>Pos.</th><th>Idade</th><th class="right">OVR</th></tr></thead><tbody>${S.players.slice().sort((a,b)=>b.overall-a.overall).map(p=>`<tr><td>${p.name} ${p.real?"<span class=pill>Real</span>":""}</td><td>${p.position}</td><td>${p.age||"—"}</td><td class="right ov">${p.overall}</td><td>${Math.round(p.stamina??100)}%</td></tr>`).join("")}</tbody></table></div>`:`<div class="notice warn">Este clube ainda não tem jogadores cadastrados.</div>`,"s12")}</div>`}
function market(){let pool=DB.players.filter(p=>p.teamId!==S.clubId&&!S.players.some(x=>x.id===p.id));return `<h1>Mercado de transferências</h1><div class="grid">${box("Pesquisa de jogadores",`<div class="field"><label>Nome</label><input id="marketName" placeholder="Pesquisar jogador..." style="min-width:190px"><label>Posição</label><select id="marketPos"><option value="">Todas</option>${[...new Set(DB.players.map(p=>p.position))].sort().map(x=>`<option>${x}</option>`).join("")}</select><label>Overall mínimo</label><select id="marketMin">${[0,50,60,65,70,75,80,85,90].map(n=>`<option value="${n}">${n===0?"Qualquer":n+"+"}</option>`).join("")}</select><label>Overall máximo</label><select id="marketMax">${[100,99,95,90,85,80,75,70,65].map(n=>`<option value="${n}">${n}</option>`).join("")}</select><button id="marketClear">Limpar filtros</button></div><div class="row"><span class="muted" id="marketCount">${pool.length} jogadores encontrados</span><span class="pill">Saldo: ${money(S.cash)}</span></div><div class="scroll"><table><thead><tr><th>Jogador</th><th>Clube</th><th>Pos.</th><th>OVR</th><th>Preço</th><th></th></tr></thead><tbody id="marketRows"></tbody></table></div>` ,"s12")}</div>`}
function filterMarket(){let q=(document.querySelector("#marketName")?.value||"").toLocaleLowerCase("pt-BR"),pos=document.querySelector("#marketPos")?.value||"",min=Number(document.querySelector("#marketMin")?.value||0),max=Number(document.querySelector("#marketMax")?.value||100);let pool=DB.players.filter(p=>p.teamId!==S.clubId&&!S.players.some(x=>x.id===p.id)&&p.name.toLocaleLowerCase("pt-BR").includes(q)&&(!pos||p.position===pos)&&p.overall>=min&&p.overall<=max).sort((a,b)=>b.overall-a.overall);let rows=document.querySelector("#marketRows");if(!rows)return;rows.innerHTML=pool.map(p=>`<tr><td><b>${p.name}</b></td><td>${team(p.teamId)?.name||"—"}</td><td>${p.position}</td><td class="ov">${p.overall}</td><td>${money(p.overall*p.overall*1700)}</td><td><button data-buy="${p.id}">Contratar</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">Nenhum jogador corresponde aos filtros.</td></tr>`;document.querySelector("#marketCount").textContent=pool.length+" jogadores encontrados";document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy))}
function competitions(){return `<h1>Competições e regulamentos 2026</h1><div class="grid">${DB.regulations.map(r=>box(r.name,`<p>${r.format}</p>${r.promotion?`<p><b>Acesso:</b> ${r.promotion}</p>`:""}${r.relegation?`<p><b>Rebaixamento:</b> ${r.relegation}</p>`:""}${r.continental?`<p><b>Vagas:</b> ${r.continental}</p>`:""}`,"s12")).join("")}<section class="card s12"><h2>Grupos da Série D 2026</h2><div class="grid">${Object.entries(DB.serieDGroups).map(([g,teams])=>`<div class="card"><b>Grupo ${g}</b><ol>${teams.map(t=>`<li>${t}</li>`).join("")}</ol></div>`).join("")}</div></section></div>`}
function finance(){let wages=S.players.reduce((s,p)=>s+p.overall*p.overall*5,0);return `<h1>Finanças</h1><div class="grid">${box("Orçamento",`<div class="big green">${money(S.cash)}</div><div class="stats"><div class="stat"><small>Folha semanal estimada</small><b>${money(wages)}</b></div><div class="stat"><small>Bilheteria por jogo em casa</small><b>${money(1200000)}</b></div><div class="stat"><small>Patrocínio por rodada</small><b>${money(2200000)}</b></div></div><p>Receitas: bilheteria, patrocínios, direitos de TV, premiações e vendas.</p><p>Despesas: salários, bônus, contratações e melhorias do clube.</p>`,"s12")}</div>`}
function settings(){let mins=S.settings?.matchMinutes||5;return `<h1>Configurações</h1><div class="grid">${box("Duração das partidas",`<p class="muted">Escolha quanto tempo uma partida leva na vida real. O relógio da partida vai de 0 a 90 minutos durante esse período.</p><div class="field"><label for="matchMinutes">Tempo de cada partida</label><select id="matchMinutes">${[1,3,5,8,10,15,20].map(n=>`<option value="${n}" ${mins===n?"selected":""}>${n} ${n===1?"minuto":"minutos"}</option>`).join("")}</select></div><div class="notice">Configuração atual: <b>${mins} ${mins===1?"minuto":"minutos"}</b> por partida. A alteração vale para os próximos jogos e fica salva neste dispositivo.</div><p class="muted tiny">Dica: 1–3 minutos para partidas rápidas; 5–10 para uma experiência equilibrada; 15–20 para acompanhar com mais calma.</p><button class="primary" id="saveSettings">Salvar configurações</button>` ,"s12")}${box("Preferências salvas",`<p>As configurações e o progresso da carreira são guardados automaticamente no armazenamento local do navegador.</p><p class="muted tiny">Se limpar os dados do navegador ou trocar de aparelho, exporte um backup na aba Base de dados para não perder sua carreira.</p>` ,"s12")}</div>`}
function database(){let counts={};DB.teams.forEach(t=>counts[t.league]=(counts[t.league]||0)+1);return `<h1>Base offline MiraFoot 2026</h1><div class="grid">${box("Conteúdo incluído",`<div class="stats"><div class="stat"><small>Clubes</small><b>${DB.teams.length}</b></div><div class="stat"><small>Jogadores reais</small><b>${DB.players.length}</b></div><div class="stat"><small>Grupos Série D</small><b>16</b></div></div><table><tbody>${Object.entries(counts).map(([k,v])=>`<tr><td>${k}</td><td class="right">${v} clubes</td></tr>`).join("")}</tbody></table><div class="notice">A base é incorporada ao site: o jogo não chama API. Elencos completos de todas as divisões não estão disponíveis nesta edição; os nomes marcados como reais foram selecionados de listas oficiais publicadas para 2026/27 e estatísticas CBF 2026. Overalls, valores e salários são notas econômicas criadas pelo MiraFoot.</div><button id="export">Exportar backup da carreira</button> <button id="import">Importar backup</button><input type="file" id="file" accept="application/json" hidden>`,"s12")}</div>`}
function preMatch(){let opponent=DB.teams.filter(t=>t.id!==S.clubId)[S.round%Math.max(1,DB.teams.length-1)];let chosen=currentXI();let positions=["GOL","LD","ZAG","ZAG","LE","VOL","MC","MEI","ATA","ATA","ATA"];return `<div class="match-shell"><h1>Preparação da partida</h1><div class="notice">Confira os titulares, escolha o estilo de jogo e ajuste o time antes de entrar em campo.</div><div class="card s12"><div class="row"><b>${club().name}</b><span class="big">×</span><b>${opponent?.name||"Adversário"}</b></div><div class="field"><label>Formação</label><select id="preFormation">${["4-3-3","4-4-2","4-2-3-1","3-5-2"].map(f=>`<option ${S.formation===f?"selected":""}>${f}</option>`).join("")}</select><label>Estilo de jogo</label><select id="preStyle">${["Defensivo","Equilibrado","Ofensivo","Contra-ataque","Posse de bola"].map(x=>`<option ${S.settings.style===x?"selected":""}>${x}</option>`).join("")}</select><button id="recommendXI">Recomendar escalação</button></div><div class="scroll"><table><thead><tr><th>Pos.</th><th>Titular</th><th>OVR</th><th>Energia</th></tr></thead><tbody>${positions.map((role,i)=>{let p=chosen[i];return `<tr><td><b>${role}</b></td><td><select data-pre-slot="${i}" style="min-width:180px">${S.players.slice().sort((a,b)=>b.overall-a.overall).map(x=>`<option value="${x.id}" ${x.id===p?.id?"selected":""}>${x.name} — ${x.position}</option>`).join("")}</select></td><td class="ov">${p?.overall||"—"}</td><td>${Math.round(p?.stamina??100)}%</td></tr>`}).join("")}</tbody></table></div><p class="muted">A energia diminui durante o jogo. Jogadores cansados rendem menos; o intervalo aos 45 minutos permite alterações.</p><div class="actions"><button id="savePreXI">Salvar escalação</button><button class="primary" id="kickoff">Iniciar partida</button><button data-go="home">Voltar</button></div></div></div>`}
function matchPage(){if(!activeMatch)return `<h1>Partida</h1><div class="notice">Nenhuma partida em andamento.</div><button data-go="home">Voltar ao painel</button>`;let m=activeMatch;return `<div class="match-shell"><div class="row"><h1>Partida ao vivo</h1><button id="exitMatch">Voltar ao painel</button></div><div class="scoreboard"><div class="scoreline"><strong>${m.home}</strong><div><div class="score" id="liveScore">${m.myGoals} × ${m.theirGoals}</div><div class="match-clock" id="matchClock">${m.minute}'</div></div><strong>${m.opponent.name}</strong></div><div class="muted" style="color:#c3d6e5" id="matchStatus">${matchPaused?"PAUSADA":"EM ANDAMENTO"}</div><div style="height:9px;background:#061b2c;margin-top:12px"><div id="matchProgress" style="height:100%;width:${m.minute/90*100}%;background:#5be0a0"></div></div><div class="row" style="margin-top:8px"><span id="matchRemaining">${m.remaining}s restantes</span><button id="pauseMatch">${matchPaused?(m.halftime?"Iniciar 2º tempo":"Continuar"):"Pausar"}</button></div></div><div class="grid" style="margin-top:12px">${box("Narração da partida",`<div class="event-feed" id="eventFeed">${m.events.slice().reverse().map(e=>`<div class="event ${e.kind||""}"><time>${e.minute}'</time><span>${e.text}</span></div>`).join("")}</div>` ,"s7")}${box("Substituições e banco",`<p class="muted">Faça alterações durante a partida. O jogador que entra assume a vaga do escolhido.</p><div class="field"><label>Sai</label><select id="subOut">${m.lineup.map(p=>`<option value="${p.id}">${p.name} (${p.position})</option>`).join("")}</select></div><div class="field"><label>Entra</label><select id="subIn">${S.players.filter(p=>!m.lineup.some(x=>x.id===p.id)).map(p=>`<option value="${p.id}">${p.name} (${p.position}) • ${p.overall} • ${Math.round(p.stamina??100)}% energia</option>`).join("")}</select></div><button class="primary" id="makeSub">Confirmar substituição</button><div class="notice" id="subStatus">${m.subs||0}/5 substituições utilizadas</div>` ,"s5")}${box("Tática e intervalo",`<div class="field"><label>Formação</label><select id="liveFormation">${["4-3-3","4-4-2","4-2-3-1","3-5-2"].map(x=>`<option ${m.formation===x?"selected":""}>${x}</option>`).join("")}</select><label>Estilo</label><select id="liveStyle">${["Defensivo","Equilibrado","Ofensivo","Contra-ataque","Posse de bola"].map(x=>`<option ${m.style===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="notice ${m.halftime?"warn":""}">${m.halftime?"INTERVALO — ajuste o time e pressione Continuar para o segundo tempo.":"O jogo pausa automaticamente aos 45 minutos."}</div><div class="field"><label>Energia média</label><b>${Math.round(m.lineup.reduce((a,p)=>a+(p.stamina??100),0)/Math.max(1,m.lineup.length))}%</b></div>` ,"s12")}${box("Estatísticas",`<div class="stats"><div class="stat"><small>Finalizações</small><b id="shots">${m.shotsFor}</b></div><div class="stat"><small>Amarelos</small><b id="yellows">${m.yellows}</b></div><div class="stat"><small>Substituições</small><b id="subsCount">${m.subs||0}</b></div></div><p class="muted">Duração configurada: ${S.settings.matchMinutes} minuto(s) reais.</p>` ,"s12")}</div></div>`}
function addEvent(text,kind=""){if(!activeMatch)return;if(kind==="goal")sound("goal");else if(kind==="card-event")sound("card");else if(kind==="penalty")sound("penalty");activeMatch.events.push({minute:activeMatch.minute,text,kind});if(activeMatch.events.length>80)activeMatch.events.shift();let feed=document.querySelector("#eventFeed");if(feed){feed.innerHTML=activeMatch.events.slice().reverse().map(e=>`<div class="event ${e.kind||""}"><time>${e.minute}'</time><span>${e.text}</span></div>`).join("")}}
function minuteEvents(){let m=activeMatch;if(!m)return;let r=Math.random(),diff=(m.lineup.reduce((a,p)=>a+(p.overall*(0.72+(p.stamina??100)/350)),0)/Math.max(1,m.lineup.length)-m.their)/100+(m.style==="Ofensivo"?.10:m.style==="Defensivo"?-.08:m.style==="Posse de bola"?.04:0),pHome=Math.max(.018,Math.min(.065,.032+diff*.025)),pAway=Math.max(.015,Math.min(.06,.030-diff*.02));if(r<pHome){m.myGoals++;m.shotsFor++;addEvent(`GOOOOOOL! ${m.lineup[Math.floor(Math.random()*m.lineup.length)]?.name||"O atacante"} marca para ${m.home}!`,"goal");let sc=document.querySelector("#liveScore");if(sc)sc.textContent=m.myGoals+" × "+m.theirGoals}else if(r<pHome+pAway){m.theirGoals++;m.shotsAgainst++;addEvent(`GOL DO ADVERSÁRIO! ${m.opponent.name} balança as redes.`,"goal");let sc=document.querySelector("#liveScore");if(sc)sc.textContent=m.myGoals+" × "+m.theirGoals}else if(r<.16){m.yellows++;let who=m.lineup[Math.floor(Math.random()*m.lineup.length)];addEvent(`Cartão amarelo para ${who?.name||"um jogador"}, por falta no meio-campo.`,"card-event");let y=document.querySelector("#yellows");if(y)y.textContent=m.yellows}else if(r<.31){m.shotsFor++;addEvent(`Boa chegada do ${m.home}! A defesa adversária consegue afastar o perigo.`);let sh=document.querySelector("#shots");if(sh)sh.textContent=m.shotsFor}else if(r<.40){m.shotsAgainst++;addEvent(`${m.opponent.name} chega ao ataque, mas a finalização vai para fora.`);let sh=document.querySelector("#shots");if(sh)sh.textContent=m.shotsFor}else if(r<.45){addEvent("O árbitro marca falta. O jogo fica parado por alguns instantes.")} }
function tickMatch(){if(!activeMatch||matchPaused)return;let m=activeMatch;m.remaining--;let old=m.minute;m.minute=Math.min(90,Math.floor((m.total-m.remaining)/m.total*90));if(m.minute>old){let elapsed=m.minute-old;for(let p of m.lineup){let drain=(m.style==="Ofensivo"?0.68:m.style==="Contra-ataque"?0.52:m.style==="Defensivo"?0.40:0.48)*elapsed;p.stamina=Math.max(5,(p.stamina??100)-drain);let roster=S.players.find(x=>x.id===p.id);if(roster)roster.stamina=p.stamina}if(m.minute>=45&&!m.halftimeReached){m.minute=45;m.halftime=true;m.halftimeReached=true;m.halftimeReached=true;matchPaused=true;sound("whistle");addEvent("Intervalo! A partida foi pausada automaticamente. Faça alterações para o segundo tempo.");render();return}else if(m.minute>45||!m.halftime)minuteEvents()}updateMatchClock();if(m.remaining<=0)finishMatch();save()}
const views={home,club:clubPage,squad,market,competitions,finance,settings,database,match:matchPage,preMatch};
function render(){nav();save();$("#app").innerHTML=views[page]();document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});
if(page==="club"){$("#filter").onchange=e=>document.querySelectorAll("#clubs tr").forEach(r=>r.style.display=!e.target.value||r.dataset.league===e.target.value?"":"none");document.querySelectorAll("[data-club]").forEach(b=>b.onclick=()=>selectClub(b.dataset.club))}
if(page==="squad"&&club()){$("#preset").onchange=e=>{S.preset=e.target.value;render()};$("#formation").onchange=e=>{S.formation=e.target.value;save();render()};document.querySelectorAll("[data-slot]").forEach(sel=>sel.onchange=()=>{let ids=[...document.querySelectorAll("[data-slot]")].map(x=>x.value);if(new Set(ids).size!==11){alert("Cada jogador só pode ocupar uma posição.");render();return}S.presets[S.preset]=ids;save();render()});$("#saveXI").onclick=()=>{let ids=[...document.querySelectorAll("[data-slot]")].map(s=>s.value);if(ids.length!==11||new Set(ids).size!==11){alert("Selecione 11 jogadores diferentes.");return}S.presets[S.preset]=ids;save();alert("Escalação salva!");render()}}
if(page==="market"){["#marketName","#marketPos","#marketMin","#marketMax"].forEach(q=>$(q).addEventListener(q==="#marketName"?"input":"change",filterMarket));$("#marketClear").onclick=()=>{$("#marketName").value="";$("#marketPos").value="";$("#marketMin").value="0";$("#marketMax").value="100";filterMarket()};filterMarket()}
if(page==="home"&&club()&&!activeMatch)$("#play").onclick=()=>{page="preMatch";render()};
if(page==="preMatch"){const readPre=()=>[...document.querySelectorAll("[data-pre-slot]")].map(x=>x.value);const savePre=()=>{let ids=readPre();if(ids.length!==11||new Set(ids).size!==11){alert("Escolha 11 jogadores diferentes.");return false}S.presets[S.preset]=ids;S.formation=$("#preFormation").value;S.settings.style=$("#preStyle").value;save();return true};$("#preFormation").onchange=e=>{S.formation=e.target.value;render()};$("#recommendXI").onclick=()=>{S.presets[S.preset]=bestXI(S.players).map(p=>p.id);save();render()};$("#savePreXI").onclick=()=>{if(savePre())alert("Escalação salva!")};$("#kickoff").onclick=()=>{if(savePre())play()}}

if(page==="home"&&activeMatch){let pb=$("#pauseMatch");if(pb)pb.onclick=togglePause;let rb=$("#returnMatch");if(rb)rb.onclick=()=>{page="match";render()}}
if(page==="match"&&activeMatch){if($("#liveFormation"))$("#liveFormation").onchange=e=>{activeMatch.formation=e.target.value;addEvent("Formação alterada para "+e.target.value+".")};if($("#liveStyle"))$("#liveStyle").onchange=e=>{activeMatch.style=e.target.value;addEvent("Estilo alterado para "+e.target.value+".")};$("#pauseMatch").onclick=togglePause;$("#exitMatch").onclick=()=>{page="home";render()};$("#makeSub").onclick=()=>{let m=activeMatch;if(m.subs>=5){alert("Limite de cinco substituições atingido.");return}let out=m.lineup.findIndex(p=>p.id===$("#subOut").value),incoming=S.players.find(p=>p.id===$("#subIn").value);if(out<0||!incoming)return;let old=m.lineup[out];m.lineup[out]={...incoming,stamina:incoming.stamina??100};m.subs=(m.subs||0)+1;addEvent(`Substituição: ${old.name} sai, ${incoming.name} entra.`,"sub-event");render();}}
if(page==="settings"){$("#saveSettings").onclick=()=>{S.settings.matchMinutes=Number($("#matchMinutes").value)||5;save();alert("Configurações salvas!");render()}}
if(page==="database"){$("#export").onclick=()=>download(JSON.stringify(S,null,2),"mirafoot-backup.json");$("#import").onclick=()=>$("#file").click();$("#file").onchange=async e=>{try{S=JSON.parse(await e.target.files[0].text());save();render();alert("Backup importado.")}catch{alert("Backup inválido.")}}}
}
function buy(id){let p=DB.players.find(x=>x.id===id);if(!p)return;let price=p.overall*p.overall*1700;if(S.cash<price){alert("Saldo insuficiente.");return}if(S.players.length>=30){alert("Elenco cheio.");return}S.cash-=price;S.players.push({...p,id:p.id+"_"+Date.now(),teamId:S.clubId});save();alert(p.name+" contratado!");render()}
function play(){if(!club()||activeMatch)return;let opponents=DB.teams.filter(t=>t.id!==S.clubId);let o=opponents[S.round%opponents.length];let lineup=currentXI();S.players.forEach(p=>{p.stamina=Math.min(100,(p.stamina??100)+22)});lineup=lineup.map(p=>({...p,stamina:S.players.find(x=>x.id===p.id)?.stamina??100}));activeMatch={opponent:o,home:club().name,style:S.settings.style||"Equilibrado",formation:S.formation||"4-3-3",halftime:false,total:(S.settings?.matchMinutes||5)*60,remaining:(S.settings?.matchMinutes||5)*60,minute:0,my:avg(lineup)||club().strength,their:o.strength,myGoals:0,theirGoals:0,shotsFor:0,shotsAgainst:0,yellows:0,subs:0,lineup:lineup.map(p=>({...p})),events:[{minute:0,text:"Bola rolando! Começa a partida no estádio.",kind:""}]};matchPaused=false;page="match";render();matchTimer=setInterval(tickMatch,1000)}
function updateMatchClock(){let c=$("#matchClock"),r=$("#matchRemaining"),p=$("#matchProgress");if(c)c.textContent=activeMatch.minute+"' / 90'";if(r)r.textContent=activeMatch.remaining+"s restantes";if(p)p.style.width=(activeMatch.minute/90*100)+"%"}
function togglePause(){matchPaused=!matchPaused;if(!matchPaused&&activeMatch&&activeMatch.halftime){activeMatch.halftime=false;addEvent("Começa o segundo tempo!")}let b=$("#pauseMatch");if(b)b.textContent=matchPaused?"Continuar":"Pausar";let st=$("#matchStatus");if(st)st.textContent=matchPaused?"PAUSADA":"EM ANDAMENTO"}
function poisson(lambda){let L=Math.exp(-lambda),k=0,prod=1;do{k++;prod*=Math.random()}while(prod>L);return k-1}
function finishMatch(){sound("whistle");clearInterval(matchTimer);matchTimer=null;let m=activeMatch;let homeGoals=m.myGoals,awayGoals=m.theirGoals;addEvent("Fim de jogo! O árbitro encerra a partida.");S.round++;if(homeGoals>awayGoals)S.w++;else if(homeGoals===awayGoals)S.d++;else S.l++;let wages=S.players.reduce((s,p)=>s+p.overall*p.overall*5,0);S.cash+=1200000+2200000+(homeGoals>awayGoals?2500000:homeGoals===awayGoals?900000:0)-wages;S.log.push({home:m.home,away:m.opponent.name,score:homeGoals+" × "+awayGoals,duration:(S.settings?.matchMinutes||5)+" min"});if(S.log.length>50)S.log.shift();activeMatch=null;matchPaused=false;save();page="home";render();alert("Fim de jogo! "+m.home+" "+homeGoals+" × "+awayGoals+" "+m.opponent.name)}
function download(data,name){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
$("#new").onclick=()=>{if(confirm("Começar uma nova carreira? Exporte o backup antes se quiser guardar o progresso.")){S=fresh();save();page="club";render()}}
</script></body></html>
