<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1523"><title>MiraFoot 2026</title>
<style>
:root{--bg:#09131f;--p:#132338;--p2:#1a2e45;--line:#30455e;--txt:#edf5ff;--muted:#a3b5c9;--green:#42d9a0;--gold:#f4ca70;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193a50,#0a1725 55%,#07101a);color:var(--txt);font:14px/1.5 system-ui,Arial}
header{position:sticky;top:0;z-index:5;background:#091522ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:27px;font-weight:950;letter-spacing:-1px}.logo span{color:var(--green)}.muted{color:var(--muted)}.tiny{font-size:11px}
button,select,input{font:inherit;color:var(--txt);background:#20364e;border:1px solid #3b5875;border-radius:10px;padding:9px 12px}button{cursor:pointer}button.primary{background:var(--green);color:#06251b;border:0;font-weight:850}button:hover{filter:brightness(1.12)}nav{display:flex;gap:5px;padding:10px 14px;background:#0d1b2b;border-bottom:1px solid var(--line);overflow:auto}nav button{white-space:nowrap;background:transparent;border-color:transparent;color:var(--muted)}nav button.active{background:var(--p2);border-color:var(--line);color:white}
main{max-width:1200px;margin:auto;padding:17px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}.card{grid-column:span 6;background:linear-gradient(145deg,#15283d,#101d2e);border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}h1{font-size:24px;margin:0 0 13px}h2{font-size:17px;margin:0 0 12px}.big{font-size:27px;font-weight:900}.green{color:var(--green)}.gold{color:var(--gold)}.pill{display:inline-block;background:#203850;border:1px solid #385570;border-radius:20px;padding:3px 8px;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#0c1928;border:1px solid var(--line);border-radius:11px;padding:10px}.stat small{display:block;color:var(--muted)}.stat b{font-size:18px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px 5px;border-bottom:1px solid #2b3e54}th{font-size:11px;color:var(--muted)}.right{text-align:right}.ov{font-weight:900;color:var(--gold)}.scroll{overflow:auto}.notice{padding:10px 12px;border:1px solid #27604f;background:#102f2a;border-radius:10px;color:#aaf1d7;margin:9px 0}.warn{background:#342a1b;border-color:#6b552f;color:#ffe3a5}.pitch{background:linear-gradient(#176344,#0c4934);border:2px solid #63bd93;border-radius:13px;padding:11px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.slot{border:1px dashed #a4dfc1;border-radius:8px;padding:6px;text-align:center;font-size:11px;min-width:0}.slot select{width:100%;padding:4px;font-size:10px;background:#0d392b}.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.field label{color:var(--muted);font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;padding:20px;color:var(--muted)}footer{text-align:center;padding:18px;color:#7187a0;font-size:11px}
@media(max-width:740px){main{padding:11px}.card,.s7,.s5{grid-column:span 12}.pitch{grid-template-columns:repeat(2,minmax(0,1fr))}table{font-size:12px}td,th{padding:7px 3px}.stat{padding:8px}.stat b{font-size:15px}}
</style></head><body><header><div><div class="logo">Mira<span>Foot</span></div><div class="muted tiny">MANAGER DE FUTEBOL • BASE OFFLINE 2026</div></div><div class="row"><span class="pill" id="season">Temporada 2026</span><button id="new">Nova carreira</button></div></header><nav id="nav"></nav><main id="app"></main><footer>MiraFoot • Banco de dados incorporado • Sem API e sem conexão externa durante o jogo</footer>
<script>
let DB, S, page="home", matchTimer=null, matchPaused=false, activeMatch=null;
const $=x=>document.querySelector(x), money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const tabs=[["home","Painel"],["club","Escolher clube"],["squad","Elenco e escalações"],["market","Mercado"],["competitions","Competições"],["finance","Finanças"],["settings","Configurações"],["database","Base de dados"]];
fetch("database.json").then(r=>r.json()).then(db=>{DB=db;init()}).catch(()=>{$("#app").innerHTML="<div class='notice warn'>Não foi possível carregar database.json. Confirme que os dois arquivos estão na mesma pasta do GitHub Pages.</div>"});
function fresh(){return {season:2026,clubId:null,players:[],cash:50000000,round:0,w:0,d:0,l:0,log:[],preset:"Titular",presets:{Titular:[],Reservas:[],Copa:[]},formation:"4-3-3",settings:{matchMinutes:5}}}
function init(){try{S=JSON.parse(localStorage.getItem("mirafoot_offline"))||fresh()}catch{S=fresh()}S.settings ||= {matchMinutes:5};if(!S.settings.matchMinutes)S.settings.matchMinutes=5;if(S.clubId&&!S.players.length)selectClub(S.clubId,false);render()}
function save(){localStorage.setItem("mirafoot_offline",JSON.stringify(S))}
function team(id){return DB.teams.find(t=>t.id===id)}
function club(){return team(S.clubId)}
function avg(a){return a.length?Math.round(a.reduce((s,p)=>s+p.overall,0)/a.length):0}
function xi(){let ids=S.presets[S.preset]||[];let chosen=ids.map(id=>S.players.find(p=>p.id===id)).filter(Boolean);return chosen.length?chosen:S.players.slice().sort((a,b)=>b.overall-a.overall).slice(0,11)}
function nav(){ $("#nav").innerHTML=tabs.map(([id,n])=>`<button class="${page===id?"active":""}" data-p="${id}">${n}</button>`).join("");document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{page=b.dataset.p;render()})}
function box(t,h,c=""){return `<section class="card ${c}"><h2>${t}</h2>${h}</section>`}
function home(){if(!club())return `<div class="notice">Bem-vindo ao MiraFoot! Escolha um clube para iniciar sua carreira.</div><button class="primary" data-go="club">Escolher clube</button>`;let next=DB.teams.filter(t=>t.id!==S.clubId)[S.round%Math.max(1,DB.teams.length-1)];return `<h1>${club().name}</h1><div class="grid">${box(`<div class="row"><span>Resumo da temporada</span><span class="pill">OVR ${avg(xi())}</span></div>`, `<div class="stats"><div class="stat"><small>Vitórias</small><b>${S.w}</b></div><div class="stat"><small>Empates</small><b>${S.d}</b></div><div class="stat"><small>Derrotas</small><b>${S.l}</b></div></div><div class="big green">${money(S.cash)}</div><div class="muted">Saldo do clube</div>`,"s7")}
${box("Próxima partida",`<div class="row"><b>${club().name}</b><span class="big">×</span><b>${next?.name||"Adversário"}</b></div><p class="muted">Escalação ativa: ${S.preset} • Duração: ${S.settings?.matchMinutes||5} min</p>${activeMatch?`<div class="notice" id="matchStatus">Partida em andamento...</div><div class="row"><b id="matchClock">${activeMatch.minute}' / 90'</b><span class="muted" id="matchRemaining">${activeMatch.remaining}s restantes</span></div><div style="height:9px;background:#071421;border-radius:9px;overflow:hidden;margin:8px 0 12px"><div id="matchProgress" style="height:100%;width:${activeMatch.minute/90*100}%;background:var(--green)"></div></div><button id="pauseMatch">${matchPaused?"Continuar":"Pausar"}</button>`:`<button class="primary" id="play">Iniciar partida</button>`}`,"s5")}
${box("Últimos resultados",S.log.length?`<table><tbody>${S.log.slice(-6).reverse().map(x=>`<tr><td>${x.home}</td><td><b>${x.score}</b></td><td>${x.away}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">Nenhum jogo disputado.</div>`,"s12")}</div>`}
function clubPage(){let leagues=[...new Set(DB.teams.map(t=>t.league))];return `<h1>Escolha seu clube</h1><div class="grid">${box("Clubes disponíveis",`<div class="field"><label>Competição</label><select id="filter"><option value="">Todas</option>${leagues.map(l=>`<option>${l}</option>`).join("")}</select></div><div class="scroll"><table id="clubs"><tbody>${DB.teams.map(t=>`<tr data-league="${t.league}"><td><b>${t.name}</b><div class="muted tiny">${t.league} • ${t.country}</div></td><td class="right"><span class="pill">Força ${t.strength}</span></td><td class="right"><button data-club="${t.id}">Escolher</button></td></tr>`).join("")}</tbody></table></div>`,"s12")}</div>`}
function selectClub(id,ask=true){let t=team(id);if(!t)return;if(ask&&S.clubId&&!confirm("Trocar de clube? Isso inicia uma nova carreira com o elenco desse clube."))return;S.clubId=id;S.players=DB.players.filter(p=>p.teamId===id).map(p=>({...p}));S.cash= Math.max(8000000,t.strength*1100000);S.round=0;S.w=S.d=S.l=0;S.log=[];S.presets={Titular:[],Reservas:[],Copa:[]};S.preset="Titular";save();page="home";render()}
function squad(){if(!club())return `<div class="notice">Escolha um clube primeiro.</div>`;let selected=xi();return `<h1>Elenco e escalações</h1><div class="grid">${box("Escalações salvas",`<div class="field"><label>Preset</label><select id="preset">${Object.keys(S.presets).map(p=>`<option ${S.preset===p?"selected":""}>${p}</option>`).join("")}</select><button id="saveXI" class="primary">Salvar escalação</button></div><div class="field"><label>Formação</label><select id="formation">${["4-3-3","4-4-2","4-2-3-1","3-5-2"].map(f=>`<option ${S.formation===f?"selected":""}>${f}</option>`).join("")}</select></div><div class="pitch">${Array.from({length:11},(_,i)=>`<div class="slot">${["GOL","ZAG","ZAG","LE","LD","VOL","MC","MC","MEI","ATA","ATA"][i]}<select data-slot="${i}"><option value="">Selecionar</option>${S.players.map(p=>`<option value="${p.id}" ${selected[i]?.id===p.id?"selected":""}>${p.name} (${p.overall})</option>`).join("")}</select></div>`).join("")}</div><p class="muted tiny">Salve Titular, Reservas e Copa separadamente. Troque o preset para mudar o time inteiro de uma vez.</p>`,"s6")}
${box("Jogadores do clube",S.players.length?`<div class="scroll"><table><thead><tr><th>Jogador</th><th>Pos.</th><th>Idade</th><th class="right">OVR</th></tr></thead><tbody>${S.players.sort((a,b)=>b.overall-a.overall).map(p=>`<tr><td>${p.name} ${p.real?"<span class=pill>Real</span>":""}</td><td>${p.position}</td><td>${p.age||"—"}</td><td class="right ov">${p.overall}</td></tr>`).join("")}</tbody></table></div>`:`<div class="notice warn">Este clube ainda não tem jogadores cadastrados na base offline. A base contém elencos selecionados de clubes internacionais e nomes brasileiros confirmados em estatísticas oficiais, não elencos completos de todos os clubes.</div>`,"s6")}</div>`}
function market(){let pool=DB.players.filter(p=>p.teamId!==S.clubId&&!S.players.some(x=>x.id===p.id)).sort((a,b)=>b.overall-a.overall);return `<h1>Mercado de transferências</h1><div class="grid">${box("Jogadores disponíveis",`<p class="muted">Jogadores reais incluídos na base. O valor e o salário são estimativas do jogo.</p><div class="scroll"><table><thead><tr><th>Jogador</th><th>Clube</th><th>Pos.</th><th>OVR</th><th>Preço</th><th></th></tr></thead><tbody>${pool.map(p=>`<tr><td>${p.name}</td><td>${team(p.teamId)?.name||"—"}</td><td>${p.position}</td><td class="ov">${p.overall}</td><td>${money(p.overall*p.overall*1700)}</td><td><button data-buy="${p.id}">Contratar</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">Sem atletas disponíveis.</td></tr>`}</tbody></table></div>`,"s12")}</div>`}
function competitions(){return `<h1>Competições e regulamentos 2026</h1><div class="grid">${DB.regulations.map(r=>box(r.name,`<p>${r.format}</p>${r.promotion?`<p><b>Acesso:</b> ${r.promotion}</p>`:""}${r.relegation?`<p><b>Rebaixamento:</b> ${r.relegation}</p>`:""}${r.continental?`<p><b>Vagas:</b> ${r.continental}</p>`:""}`,"s12")).join("")}<section class="card s12"><h2>Grupos da Série D 2026</h2><div class="grid">${Object.entries(DB.serieDGroups).map(([g,teams])=>`<div class="card"><b>Grupo ${g}</b><ol>${teams.map(t=>`<li>${t}</li>`).join("")}</ol></div>`).join("")}</div></section></div>`}
function finance(){let wages=S.players.reduce((s,p)=>s+p.overall*p.overall*5,0);return `<h1>Finanças</h1><div class="grid">${box("Orçamento",`<div class="big green">${money(S.cash)}</div><div class="stats"><div class="stat"><small>Folha semanal estimada</small><b>${money(wages)}</b></div><div class="stat"><small>Bilheteria por jogo em casa</small><b>${money(1200000)}</b></div><div class="stat"><small>Patrocínio por rodada</small><b>${money(2200000)}</b></div></div><p>Receitas: bilheteria, patrocínios, direitos de TV, premiações e vendas.</p><p>Despesas: salários, bônus, contratações e melhorias do clube.</p>`,"s12")}</div>`}
function settings(){let mins=S.settings?.matchMinutes||5;return `<h1>Configurações</h1><div class="grid">${box("Duração das partidas",`<p class="muted">Escolha quanto tempo uma partida leva na vida real. O relógio da partida vai de 0 a 90 minutos durante esse período.</p><div class="field"><label for="matchMinutes">Tempo de cada partida</label><select id="matchMinutes">${[1,3,5,8,10,15,20].map(n=>`<option value="${n}" ${mins===n?"selected":""}>${n} ${n===1?"minuto":"minutos"}</option>`).join("")}</select></div><div class="notice">Configuração atual: <b>${mins} ${mins===1?"minuto":"minutos"}</b> por partida. A alteração vale para os próximos jogos e fica salva neste dispositivo.</div><p class="muted tiny">Dica: 1–3 minutos para partidas rápidas; 5–10 para uma experiência equilibrada; 15–20 para acompanhar com mais calma.</p><button class="primary" id="saveSettings">Salvar configurações</button>` ,"s12")}${box("Preferências salvas",`<p>As configurações e o progresso da carreira são guardados automaticamente no armazenamento local do navegador.</p><p class="muted tiny">Se limpar os dados do navegador ou trocar de aparelho, exporte um backup na aba Base de dados para não perder sua carreira.</p>` ,"s12")}</div>`}
function database(){let counts={};DB.teams.forEach(t=>counts[t.league]=(counts[t.league]||0)+1);return `<h1>Base offline MiraFoot 2026</h1><div class="grid">${box("Conteúdo incluído",`<div class="stats"><div class="stat"><small>Clubes</small><b>${DB.teams.length}</b></div><div class="stat"><small>Jogadores reais</small><b>${DB.players.length}</b></div><div class="stat"><small>Grupos Série D</small><b>16</b></div></div><table><tbody>${Object.entries(counts).map(([k,v])=>`<tr><td>${k}</td><td class="right">${v} clubes</td></tr>`).join("")}</tbody></table><div class="notice">A base é incorporada ao site: o jogo não chama API. Elencos completos de todas as divisões não estão disponíveis nesta edição; os nomes marcados como reais foram selecionados de listas oficiais publicadas para 2026/27 e estatísticas CBF 2026. Overalls, valores e salários são notas econômicas criadas pelo MiraFoot.</div><button id="export">Exportar backup da carreira</button> <button id="import">Importar backup</button><input type="file" id="file" accept="application/json" hidden>`,"s12")}</div>`}
const views={home,club:clubPage,squad,market,competitions,finance,settings,database};
function render(){nav();save();$("#app").innerHTML=views[page]();document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});
if(page==="club"){$("#filter").onchange=e=>document.querySelectorAll("#clubs tr").forEach(r=>r.style.display=!e.target.value||r.dataset.league===e.target.value?"":"none");document.querySelectorAll("[data-club]").forEach(b=>b.onclick=()=>selectClub(b.dataset.club))}
if(page==="squad"&&club()){$("#preset").onchange=e=>{S.preset=e.target.value;render()};$("#formation").onchange=e=>{S.formation=e.target.value;save()};$("#saveXI").onclick=()=>{let ids=[...document.querySelectorAll("[data-slot]")].map(s=>s.value).filter(Boolean);if(ids.length!==11||new Set(ids).size!==11){alert("Selecione 11 jogadores diferentes.");return}S.presets[S.preset]=ids;save();alert("Escalação salva!");render()}}
if(page==="market")document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));
if(page==="home"&&club()&&!activeMatch)$("#play").onclick=play;
if(page==="home"&&activeMatch){let pb=$("#pauseMatch");if(pb)pb.onclick=togglePause}
if(page==="settings"){$("#saveSettings").onclick=()=>{S.settings.matchMinutes=Number($("#matchMinutes").value)||5;save();alert("Configurações salvas!");render()}}
if(page==="database"){$("#export").onclick=()=>download(JSON.stringify(S,null,2),"mirafoot-backup.json");$("#import").onclick=()=>$("#file").click();$("#file").onchange=async e=>{try{S=JSON.parse(await e.target.files[0].text());save();render();alert("Backup importado.")}catch{alert("Backup inválido.")}}}
}
function buy(id){let p=DB.players.find(x=>x.id===id);if(!p)return;let price=p.overall*p.overall*1700;if(S.cash<price){alert("Saldo insuficiente.");return}if(S.players.length>=30){alert("Elenco cheio.");return}S.cash-=price;S.players.push({...p,id:p.id+"_"+Date.now(),teamId:S.clubId});save();alert(p.name+" contratado!");render()}
function play(){if(!club()||activeMatch)return;let opponents=DB.teams.filter(t=>t.id!==S.clubId);let o=opponents[S.round%opponents.length];activeMatch={opponent:o,home:club().name,total:(S.settings?.matchMinutes||5)*60,remaining:(S.settings?.matchMinutes||5)*60,minute:0,my:avg(xi())||club().strength,their:o.strength};matchPaused=false;render();matchTimer=setInterval(()=>{if(!activeMatch||matchPaused)return;activeMatch.remaining--;activeMatch.minute=Math.min(90,Math.floor((activeMatch.total-activeMatch.remaining)/activeMatch.total*90));updateMatchClock();if(activeMatch.remaining<=0)finishMatch()},1000)}
function updateMatchClock(){let c=$("#matchClock"),r=$("#matchRemaining"),p=$("#matchProgress");if(c)c.textContent=activeMatch.minute+"' / 90'";if(r)r.textContent=activeMatch.remaining+"s restantes";if(p)p.style.width=(activeMatch.minute/90*100)+"%"}
function togglePause(){matchPaused=!matchPaused;let b=$("#pauseMatch");if(b)b.textContent=matchPaused?"Continuar":"Pausar";let st=$("#matchStatus");if(st)st.textContent=matchPaused?"Partida pausada":"Partida em andamento..."}
function poisson(lambda){let L=Math.exp(-lambda),k=0,prod=1;do{k++;prod*=Math.random()}while(prod>L);return k-1}
function finishMatch(){clearInterval(matchTimer);matchTimer=null;let m=activeMatch;let diff=(m.my+3-m.their)/20;let homeGoals=Math.min(7,poisson(Math.max(.25,1.25+diff*.55)));let awayGoals=Math.min(7,poisson(Math.max(.2,1.1-diff*.45)));S.round++;if(homeGoals>awayGoals)S.w++;else if(homeGoals===awayGoals)S.d++;else S.l++;let wages=S.players.reduce((s,p)=>s+p.overall*p.overall*5,0);S.cash+=1200000+2200000+(homeGoals>awayGoals?2500000:homeGoals===awayGoals?900000:0)-wages;S.log.push({home:m.home,away:m.opponent.name,score:homeGoals+" × "+awayGoals,duration:(S.settings?.matchMinutes||5)+" min"});if(S.log.length>50)S.log.shift();activeMatch=null;matchPaused=false;save();render();alert("Fim de jogo! "+m.home+" "+homeGoals+" × "+awayGoals+" "+m.opponent.name)}
function download(data,name){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
$("#new").onclick=()=>{if(confirm("Começar uma nova carreira? Exporte o backup antes se quiser guardar o progresso.")){S=fresh();save();page="club";render()}}
</script></body></html>
