function shootout(f){const kick=(id,i)=>{let ov=T(id).strength,nm='Jogador';const pl=id===S.club?xiP().filter(p=>p.position!=='GOL').sort((a,b)=>(hasTr(b,'Pênaltis')?5:0)+b.overall-(hasTr(a,'Pênaltis')?5:0)-a.overall):DB.players.filter(p=>p.teamId===id&&p.position!=='GOL').sort((a,b)=>b.overall-a.overall);if(pl.length){const p=pl[i%pl.length];ov=p.overall;nm=p.name}return{ok:Math.random()<Math.max(.55,Math.min(.92,.72+(ov-70)/120)),nm}};
const log=[];let hs=0,as=0;for(let i=0;i<5;i++){const a=kick(f.h,i);log.push({t:'h',...a});if(a.ok)hs++;const b=kick(f.a,i);log.push({t:'a',...b});if(b.ok)as++;if(hs>as+(4-i)||as>hs+(4-i))break}
let i=5;while(hs===as&&i<20){const a=kick(f.h,i),b=kick(f.a,i);log.push({t:'h',...a},{t:'a',...b});if(a.ok)hs++;if(b.ok)as++;i++}if(hs===as)hs++;return{hs,as,log,w:hs>as?f.h:f.a}}
function etCheck(){if(M.min<90)return true;const fx=M.cup?M.cup.flatMap(d=>d.fx):[];
if(M.min===90&&!M.etd){M.etd=1;const need=fx.filter(needDec);need.forEach(f=>f.dec=1);if(need.length){M.et=true;whistle();return true}return false}
if(M.et&&M.min<120)return true;
if(M.et&&!M.shd){M.shd=1;fx.filter(f=>f.dec&&needDec(f)).forEach(f=>{f.sh=shootout(f);if(f.t)f.t.shw=f.sh.w});if(M.p.sh&&!M.spec){M.paused=true;SH={i:0};scr='shoot';clearInterval(SHT);SHT=setInterval(()=>{SH.i++;if(scr==='shoot')render();if(SH.i>=M.p.sh.log.length+2)clearInterval(SHT)},900);return true}return false}
return false}

function resultCard(){if(M.spec||(!M.cup&&!S.club))return'';const p=M.p,me=p.h===S.club,mg=me?p.hg:p.ag,og=me?p.ag:p.hg;let o=mg>og?'V':mg<og?'D':'E';if(p.sh)o=p.sh.w===S.club?'V':'D';const pts=mg>og?3:mg===og?1:0,col=o==='V'?'#2ecc71':o==='E'?'#f1c40f':'#e74c3c',txt=o==='V'?'VITÓRIA':o==='E'?'EMPATE':'DERROTA';let ex='',pl='';

const R=rngS((S.seed||'x')+'t'+S.season),mine=curCtry();DB.leagueMeta&&Object.keys(DB.leagueMeta).forEach(l=>{if(DB.leagueMeta[l].tier!==1||ctry(l)===mine)return;const ts=DB.teams.filter(t=>t.league===l);if(!ts.length)return;const wt=ts.map(t=>Math.pow(t.strength,5)),sm=wt.reduce((a,b)=>a+b,0);let r=R()*sm,w=ts[0];for(let i=0;i<ts.length;i++){r-=wt[i];if(r<=0){w=ts[i];break}}tweet('copas',`🏆 ${w.name} conquista a ${l.split(' • ')[1]} ${S.season}! #campeao`)})}
