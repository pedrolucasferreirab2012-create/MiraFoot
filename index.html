<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MiraFoot Manager</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#050a06;color:#fff;font:16px Arial,Helvetica,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#16301e,#0b1a10 45%,#10281a);overflow:hidden}
.scr{flex:1;overflow-y:auto;min-height:0}
.gold{color:#e6c35c}.red{color:#ff6b6b}.org{color:#f0b84a}.mut{color:#9fb3a3}
.top{background:#0d0d0d;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #333}
.top h1{font:400 24px Arial;white-space:nowrap}.top small{display:block;font-size:15px;margin-top:3px}
.bar{height:15px;background:#000;border:1px solid #444;border-radius:8px;overflow:hidden;width:110px;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%;background:#e63b2e}
.rt{text-align:right;font-size:14px;color:#ddd}
.acts{display:flex;gap:8px;padding:8px 10px;background:#0a0a0a}
button,select,input{font:inherit;color:#fff;background:#243a2b;border:1px solid #4b6b55;border-radius:6px;padding:8px 12px}
button.p{background:#c49a1a;color:#111;font-weight:700;border-color:#e6c35c}.acts button{flex:1}
.row{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid #3a5a44;background:rgba(10,40,25,.62);gap:9px}
.fl{width:34px;text-align:center;font-size:12px;font-weight:700}.fl b{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 2px;border:2px solid #fff}
.nm{flex:1;min-width:0}.nm div:first-child{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm div+div{font-size:14px;color:#cfe0d3}
.ov{width:34px;text-align:center;font-size:20px}.pr{width:84px;text-align:right;font-size:14px;font-weight:700}.pr span{display:block;font-weight:400;color:#cfe0d3}
.ic{width:38px;height:38px;flex:none;border-radius:50%;background:#222;border:1px solid #555;padding:0;font-size:20px}
.tabs{display:flex;background:#050505;border-top:1px solid #333;padding-bottom:env(safe-area-inset-bottom,0)}.tabs button{flex:1;background:none;border:0;font-size:30px;padding:10px 0;border-radius:0}.tabs .on{background:#1b2a1f}
.hd{display:flex;align-items:stretch;gap:0;padding:10px 8px 4px}.hd .t{flex:1;padding:12px 6px;text-align:center;font-size:20px;display:flex;align-items:center;justify-content:center;min-height:56px;overflow:hidden}
.hd .sc{width:98px;text-align:center;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sl{display:flex;justify-content:space-between;padding:4px 10px;font-size:14px;min-height:40px;gap:8px}.sl div{flex:1}.sl div+div{text-align:right}
.ring{width:62px;height:62px;position:relative}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.gm{background:rgba(0,0,0,.45);margin:6px 8px;border-radius:4px;padding:6px 4px}.gm h3{text-align:center;font-weight:400;color:#e6c35c;padding:8px;font-size:19px}
.gm p{display:flex;justify-content:center;gap:8px;font-size:16px;line-height:1.55;text-shadow:0 1px 2px #000}.gm p span:first-child{flex:1;text-align:right}.gm p span:last-child{flex:1}.gm p b{width:62px;text-align:center}
.gm p.me{background:rgba(230,195,92,.2)}
.ctl{display:flex;gap:8px;padding:8px;background:#050505}.ctl button{flex:1;padding:12px}
.lu{display:flex;flex:1;min-height:0;background:#0a1330}.bn{width:31%;overflow-y:auto;padding:6px 4px;background:#0b1233}
.bp{text-align:center;font-size:12px;font-weight:700;padding:6px 2px;border-radius:6px;line-height:1.25;text-shadow:0 0 3px #000,0 0 3px #000}.bp.s{outline:3px solid #ffd54a;background:rgba(255,213,74,.25)}
.sh{width:34px;height:36px;margin:0 auto;position:relative;border-radius:5px 5px 8px 8px;background:var(--a);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}.sh:before{content:"";position:absolute;left:12px;width:10px;top:0;bottom:0;background:var(--b)}
.sh:after{content:"";position:absolute;top:0;left:-9px;right:-9px;height:13px;border-radius:5px;background:var(--a);z-index:-1}
.pt{position:relative;flex:1;margin:6px;border:2px solid #dfe9d6;background:repeating-linear-gradient(0deg,#4b8a32 0 40px,#5a9a3e 40px 80px)}
.pt:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #dfe9d6}.pt:after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border:2px solid #dfe9d6;border-radius:50%}
.pp{position:absolute;transform:translate(-50%,-50%);text-align:center;width:72px;font-size:10px;line-height:1.2;font-weight:700;z-index:2;text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000}.pp.s{filter:drop-shadow(0 0 6px #ffd54a)}
.bd{position:absolute;right:-6px;top:14px;background:#1e6fd6;border-radius:5px;padding:1px 4px;font-size:12px}
.cf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px;background:#0b1233;font-size:13px}.cf label{display:block;margin-bottom:3px}.cf select{width:100%;background:#fff;color:#000;padding:6px;border-radius:3px}
.pad{padding:12px}.st{display:flex;flex-direction:column;gap:10px;padding:16px}
.cl{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #2c4a35;background:rgba(0,0,0,.25)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:7px 5px;text-align:center;border-bottom:1px solid #2c4a35}td:nth-child(2),th:nth-child(2){text-align:left}tr.me{background:rgba(230,195,92,.25)}
.logo{font-size:44px;text-align:center;margin:24px 0 4px;letter-spacing:1px}.logo span{color:#e6c35c}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),el=$('#app');
const POS={GOL:'G',LD:'LD',ZAG:'ZG',LE:'LE',VOL:'VL',MC:'MC',MEI:'MA',ATA:'AT'},ORD=['GOL','LD','ZAG','LE','VOL','MC','MEI','ATA'];
const SK={GOL:'Def/Ref',LD:'Cru/Mar',ZAG:'Mar/Cab',LE:'Cru/Vel',VOL:'Mar/Des',MC:'Pas/Arm',MEI:'Dri/Pas',ATA:'Fin/Cab'};
const FORMS={
'4-3-3':[['GOL',50,90],['LE',11,72],['ZAG',35,78],['ZAG',65,78],['LD',89,72],['VOL',50,56],['MC',24,44],['MC',76,44],['ATA',17,16],['ATA',50,10],['ATA',83,16]],
'4-4-2':[['GOL',50,90],['LE',11,72],['ZAG',35,78],['ZAG',65,78],['LD',89,72],['MEI',14,44],['VOL',38,52],['MC',62,52],['MEI',86,44],['ATA',36,14],['ATA',64,14]],
'4-2-3-1':[['GOL',50,90],['LE',11,72],['ZAG',35,78],['ZAG',65,78],['LD',89,72],['VOL',36,58],['VOL',64,58],['MEI',16,34],['MEI',50,32],['MEI',84,34],['ATA',50,10]],
'3-5-2':[['GOL',50,90],['ZAG',24,76],['ZAG',50,78],['ZAG',76,76],['LE',8,48],['MC',30,52],['VOL',50,58],['MC',70,52],['LD',92,48],['ATA',36,14],['ATA',64,14]]};
const STY=['Defensivo','Equilibrado','Ofensivo'],MRK=['Leve','Normal','Forte'],FOC=['Pela esquerda','Pelo meio','Pela direita'];
const ADJ={LD:{LE:.92,ZAG:.88,VOL:.82,MC:.8},LE:{LD:.92,ZAG:.88,VOL:.82,MC:.8},ZAG:{VOL:.85,LD:.85,LE:.85},VOL:{MC:.93,ZAG:.85,MEI:.85,LD:.8,LE:.8},MC:{VOL:.93,MEI:.93,LD:.8,LE:.8,ATA:.8},MEI:{MC:.93,ATA:.9,VOL:.85},ATA:{MEI:.9,MC:.8}};
let DB,S,M=null,scr='start',sel=null,filt={q:'',pos:''},stLg='';
const fit=(p,r)=>p===r?1:(p==='GOL'||r==='GOL')?.3:((ADJ[p]||{})[r]||.7);
const eff=(p,r)=>p.overall*fit(p.position,r)*(.7+.3*(p.st??100)/100);
const fm=n=>{n=Math.round(n);const m=Math.floor(n/1e6),k=Math.round(n%1e6/1e3);return m?m+'M '+k+'k':k+' k'};
const price=p=>p.overall*p.overall*1700,wage=p=>p.overall*p.overall*5;
const hue=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const T=id=>DB.teams.find(t=>t.id===id),club=()=>T(S.club),ctry=l=>l.split(' • ')[0];
const ctryLgs=()=>[...new Set(DB.teams.filter(t=>ctry(t.league)===ctry(club().league)).map(t=>t.league))].sort();
const dvl=l=>{const L=ctryLgs();return ctry(l)==='Brasil'?(L.indexOf(l)+1)+'ª divisão':l.split(' • ')[1]};
function shirt(id,sz){const h=hue(T(id)?.name||'x');return `style="--a:hsl(${h},70%,40%);--b:hsl(${(h+160)%360},80%,50%)"`}
function sched(l,r){let a=DB.teams.filter(t=>t.league===l).map(t=>t.id).sort();if(a.length%2)a.push(null);const n=a.length,k=r%(n-1),rest=a.slice(1);for(let i=0;i<k;i++)rest.unshift(rest.pop());const c=[a[0],...rest],o=[];for(let i=0;i<n/2;i++){let h=c[i],w=c[n-1-i];if(i===0&&k%2)[h,w]=[w,h];if(h&&w)o.push({h,a:w,hg:0,ag:0,ev:[]})}return o}
const save=()=>{try{localStorage.setItem('mirafoot_v3',JSON.stringify(S))}catch(e){}};
function fresh(id,name){const t=T(id);S={club:id,mgr:name||'Técnico',round:0,cash:Math.max(8e6,t.strength*1.1e6),dir:70,fan:70,form:'4-3-3',sty:'Equilibrado',mrk:'Leve',foc:'Pelo meio',tab:{},res:[],gl:{},xi:[],mins:3,
pl:DB.players.filter(p=>p.teamId===id).map(p=>({...p,st:100}))};DB.teams.forEach(x=>S.tab[x.id]={p:0,j:0,v:0,e:0,d:0,gp:0,gc:0});S.xi=assign(S.pl,S.form).map(p=>p.id);save()}
function assign(c,f){const roles=FORMS[f],pr=[];roles.forEach((r,i)=>c.forEach(p=>pr.push([eff(p,r[0])+(r[0]==='GOL'?(p.position==='GOL'?500:-500):0),i,p])));pr.sort((a,b)=>b[0]-a[0]);const res=[],used=new Set();pr.forEach(([v,i,p])=>{if(res[i]||used.has(p.id))return;res[i]=p;used.add(p.id)});return res}
const xiP=()=>{let a=S.xi.map(id=>S.pl.find(p=>p.id===id));if(a.length!==11||a.some(x=>!x)){a=assign(S.pl,S.form);S.xi=a.map(p=>p.id)}return a};
function myStr(){const x=xiP(),r=FORMS[S.form];let v=x.reduce((s,p,i)=>s+eff(p,r[i][0]),0)/11;return v}
function myPair(r=S.round){return sched(club().league,r).find(p=>p.h===S.club||p.a===S.club)}
function rank(){const L=DB.teams.filter(t=>t.league===club().league).map(t=>t.id);return tabSort(L).indexOf(S.club)+1}
function tabSort(L){return L.slice().sort((a,b)=>{const x=S.tab[a],y=S.tab[b];return y.p-x.p||y.v-x.v||(y.gp-y.gc)-(x.gp-x.gc)||y.gp-x.gp||(T(a).name<T(b).name?-1:1)})}
const agec=a=>a>=36?'red':a>=33?'org':'';
function render(){const f={start:vStart,squad:vSquad,match:vMatch,lineup:vLineup,cal:vCal,mkt:vMkt,tab:vTab,cfg:vCfg}[scr];el.innerHTML=f()}
function tabs(){return `<div class="tabs">${[['squad','⚽'],['cal','📅'],['mkt','💰'],['tab','🏆'],['cfg','⚙️']].map(([k,i])=>`<button class="${scr===k?'on':''}" data-a="go" data-k="${k}">${i}</button>`).join('')}</div>`}
function vStart(){const ls=[...new Set(DB.teams.map(t=>t.league))].sort();stLg=stLg||'Brasil • Série A';const cs=DB.teams.filter(t=>t.league===stLg).sort((a,b)=>b.strength-a.strength);
return `<div class="scr"><div class="logo">Mira<span>Foot</span></div><p class="mut" style="text-align:center">Manager de futebol • sem internet</p><div class="st"><input id="mg" placeholder="Seu nome (técnico)" value="${S?.mgr||''}"><select data-c="stl">${ls.map(l=>`<option ${l===stLg?'selected':''}>${l}</option>`).join('')}</select>${localStorage.getItem('mirafoot_v3')?'<button class="p" data-a="cont">Continuar carreira</button>':''}</div>${cs.map(t=>`<div class="cl"><div><b>${t.name}</b><div class="mut" style="font-size:13px">Força ${t.strength}</div></div><button data-a="pick" data-id="${t.id}">Escolher</button></div>`).join('')}</div>`}
function vSquad(){const c=club(),o=myPair(),opp=o&&T(o.h===S.club?o.a:o.h),pl=S.pl.slice().sort((a,b)=>ORD.indexOf(a.position)-ORD.indexOf(b.position)||b.overall-a.overall);
return `<div class="top"><div><h1>${c.name} (${S.round?rank()+'º':'--'})</h1><small>${S.mgr}</small><small class="gold" style="margin-top:12px"><b>Próximo Jogo</b></small><small>${c.league.replace(' • ',' - ')} - ${S.round+1}ª rodada</small><small>${o?(o.h===S.club?'C':'F')+' - '+opp.name:'Sem jogo'}</small></div><div class="rt"><div class="mut">Rodada ${S.round+1}</div>Confiança Diretoria<br><span class="bar"><i style="width:${S.dir}%"></i></span> ${S.dir}%<br>Confiança Torcida<br><span class="bar"><i style="width:${S.fan}%"></i></span> ${S.fan}%<br><b>$${fm(S.cash)}</b> &nbsp;🧍 ${S.pl.length}</div></div>
<div class="acts"><button data-a="go" data-k="lineup">Escalação</button><button class="p" data-a="play">▶ Jogar</button></div>
<div class="scr">${pl.map(p=>{const g=S.gl[p.id]||0;return `<div class="row"><div class="fl"><b style="background:hsl(${hue(T(p.teamId)?.name||'')},60%,40%)"></b>${POS[p.position]}</div><div class="nm"><div>${p.name}</div><div>I: <span class="${agec(p.age)}">${p.age??'--'}</span> E: <span class="${(p.st??100)<60?'red':''}">${Math.round(p.st??100)}%</span> &nbsp;${SK[p.position]} ${g?'⚽'+g:''}</div></div><div class="ov">${p.overall}</div><div style="width:22px;font-size:20px" class="${p.overall>=85?'red':'gold'}">${p.overall>=70?'★':''}</div><div class="pr">${fm(price(p))}<span>${fm(wage(p))}</span></div><button class="ic" data-a="sell" data-id="${p.id}">🧑‍💼</button></div>`}).join('')}</div>`+tabs()}
function vLineup(){const x=xiP(),r=FORMS[S.form],ids=new Set(S.xi),bench=S.pl.filter(p=>!ids.has(p.id)).sort((a,b)=>ORD.indexOf(a.position)-ORD.indexOf(b.position)||b.overall-a.overall);const info=(p,role)=>`${POS[p.position]} - F:${Math.round(eff(p,role||p.position))} E:${Math.round(p.st??100)}`;
const opt=(L,v,k)=>`<select data-c="${k}">${L.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
return `<div class="acts"><button data-a="auto">Automático</button><button class="p" data-a="back">${M&&!M.done?'Voltar ao jogo':'OK'}</button></div><div class="lu"><div class="bn">${bench.map(p=>`<div class="bp ${sel?.b===p.id?'s':''}" data-a="bn" data-id="${p.id}"><div class="sh" ${shirt(p.teamId)}></div>${p.name}<br>${info(p)}</div>`).join('')}</div><div class="pt">${x.map((p,i)=>`<div class="pp ${sel?.s===i?'s':''}" style="left:${r[i][1]}%;top:${r[i][2]}%" data-a="sl" data-i="${i}"><div class="sh" ${shirt(p.teamId)}><span class="bd">${(eff(p,r[i][0])/10).toFixed(1)}</span></div>${p.name}<br>${info(p,r[i][0])}</div>`).join('')}</div></div>
<div class="cf"><div><label>Formação</label>${opt(Object.keys(FORMS),S.form,'form')}</div><div><label>Estilo de jogo:</label>${opt(STY,S.sty,'sty')}</div><div><label>Marcação:</label>${opt(MRK,S.mrk,'mrk')}</div><div style="grid-column:1/4"><label>Concentrar ataque:</label>${opt(FOC,S.foc,'foc')}</div></div><div class="mut" style="font-size:12px;padding:0 8px 8px;background:#0b1233">Toque num jogador e depois em outro (campo ou banco) para trocar.${M&&!M.done?' Substituições: '+M.subs+'/5':''}</div>`}
function vMatch(){const h=T(M.p.h),a=T(M.p.a),per=M.min>45||M.min===45&&!M.ht?'2ºT':'1ºT',fmtE=s=>M.p.ev.filter(e=>e.s===s).map(e=>`${e.t==='g'?'⚽':'🟨'} ${e.n} ${e.m}' - ${e.m>45?2:1}º`).join('<br>');
const L=ctryLgs(),circ=2*Math.PI*26,pct=Math.min(1,M.min/90);
return `<div class="top" style="font-size:15px;background:#262614;color:#ccc;align-items:center"><div>${dvl(club().league)} - ${club().league.split(' • ')[1]}<br>${S.round+1}ª Rodada</div><div class="ring"><svg width="62" height="62"><circle cx="31" cy="31" r="26" fill="none" stroke="#444" stroke-width="5"/><circle cx="31" cy="31" r="26" fill="none" stroke="#f3d422" stroke-width="5" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct)}" transform="rotate(-90 31 31)"/></svg><b>${M.min}'</b></div></div>
<div class="scr"><div class="hd"><div class="t" style="background:#0a8a3a">${h.name}</div><div class="sc">${M.p.hg}x${M.p.ag}</div><div class="t" style="background:#fff;color:#7a1020">${a.name}</div></div><div class="sl"><div>${fmtE('h')}</div><div>${fmtE('a')}</div></div>
<div style="text-align:center;font-size:15px;padding:4px" class="gold">${M.done?'Fim de jogo':M.ht&&M.paused?'Intervalo - '+per:M.paused?'Pausado':per}</div>
<div class="gm"><h3>Jogos da rodada ⚙</h3>${L.map(l=>`<h3 style="padding:4px;font-size:17px">${dvl(l)}</h3>`+M.all[l].map(p=>`<p class="${p===M.p?'me':''}"><span>${T(p.h).name}</span><b>${p.hg} x ${p.ag}</b><span>${T(p.a).name}</span></p>`).join('')).join('')}</div></div>
<div class="ctl">${M.done?'<button class="p" data-a="end">Continuar</button>':`<button class="p" data-a="pause">${M.paused?(M.ht&&M.min===45?'▶ 2º tempo':'▶ Continuar'):'⏸ Pausar'}</button><button data-a="spd">x${M.spd}</button><button data-a="go" data-k="lineup">🔄 Subst. ${M.subs}/5</button><button data-a="skip">⏭</button>`}</div>`}
function vCal(){let o=[];for(let i=0;i<8;i++){const p=myPair(S.round+i);if(p)o.push(`<tr><td>${S.round+i+1}ª</td><td>${T(p.h===S.club?p.a:p.h).name}</td><td>${p.h===S.club?'Casa':'Fora'}</td></tr>`)}
return `<div class="top"><h1>Calendário</h1></div><div class="scr"><h3 class="gold pad">Próximos jogos</h3><table>${o.join('')}</table><h3 class="gold pad">Resultados</h3><table>${S.res.slice().reverse().map(r=>`<tr><td>${r.r}ª</td><td>${r.h} ${r.hg} x ${r.ag} ${r.a}</td><td>${r.o}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">Nenhum jogo ainda.</td></tr>'}</table></div>`+tabs()}
function vMkt(){const ids=new Set(S.pl.map(p=>p.id)),q=filt.q.toLowerCase(),L=DB.players.filter(p=>p.real&&!ids.has(p.id)&&p.teamId!==S.club&&(!q||p.name.toLowerCase().includes(q))&&(!filt.pos||p.position===filt.pos)).sort((a,b)=>b.overall-a.overall).slice(0,60);
return `<div class="top"><div><h1>Mercado</h1><small>Saldo $${fm(S.cash)}</small></div></div><div class="acts"><input id="mq" style="flex:2" placeholder="Buscar jogador" value="${filt.q}"><select data-c="mpos" style="flex:1"><option value="">Todas</option>${ORD.map(o=>`<option value="${o}" ${filt.pos===o?'selected':''}>${POS[o]}</option>`).join('')}</select></div><div class="scr">${L.map(p=>`<div class="row"><div class="fl">${POS[p.position]}</div><div class="nm"><div>${p.name}</div><div>${T(p.teamId)?.name||''}</div></div><div class="ov">${p.overall}</div><div class="pr">${fm(price(p))}</div><button class="p" data-a="buy" data-id="${p.id}">Contratar</button></div>`).join('')}</div>`+tabs()}
function vTab(){const L=ctryLgs(),lg=L.includes(stLg)&&ctry(stLg)===ctry(club().league)?stLg:club().league,ids=DB.teams.filter(t=>t.league===lg).map(t=>t.id);
return `<div class="top"><div><h1>Classificação</h1></div><select data-c="lg">${L.map(l=>`<option value="${l}" ${l===lg?'selected':''}>${dvl(l)}</option>`).join('')}</select></div><div class="scr"><table><tr><th>#</th><th>Time</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr>${tabSort(ids).map((id,i)=>{const t=S.tab[id];return `<tr class="${id===S.club?'me':''}"><td>${i+1}</td><td>${T(id).name}</td><td>${t.p}</td><td>${t.j}</td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td><td>${t.gp-t.gc}</td></tr>`}).join('')}</table></div>`+tabs()}
function vCfg(){return `<div class="top"><h1>Opções</h1></div><div class="scr pad"><p>Duração da partida (minutos reais)</p><select data-c="mins">${[1,3,5,10].map(n=>`<option ${S.mins===n?'selected':''}>${n}</option>`).join('')}</select><p style="margin-top:16px">Backup da carreira</p><div class="acts"><button data-a="exp">Exportar</button><button data-a="imp">Importar</button></div><input type="file" id="fi" hidden><button style="margin-top:16px" data-a="newg">Novo jogo</button><p class="mut" style="margin-top:18px;font-size:13px">Overalls, preços e salários são estimativas do jogo. Jogadores marcados como fictícios (clubes sem elenco público) são gerados automaticamente, como no Brasfoot.</p></div>`+tabs()}
/* ---- partida ---- */
function startMatch(){const all={};ctryLgs().forEach(l=>all[l]=sched(l,S.round));const p=all[club().league].find(x=>x.h===S.club||x.a===S.club);if(!p){alert('Sem jogo nesta rodada.');return}
M={all,p,min:0,paused:true,ht:false,done:false,subs:0,out:new Set(),spd:1,tm:null};scr='match';render();tick0()}
function tick0(){clearInterval(M.tm);M.tm=setInterval(tick,Math.max(60,S.mins*60000/90/M.spd))}
function strOf(id){if(id===S.club){let v=myStr();if(S.sty==='Ofensivo')v+=2;if(S.sty==='Defensivo')v-=1;return v}return T(id).strength}
const wpick=(list,w)=>{const t=list.reduce((s,p)=>s+w(p),0);let r=Math.random()*t;for(const p of list){r-=w(p);if(r<=0)return p}return list[0]};
const WG={ATA:7,MEI:4,MC:2.5,VOL:1.2,LE:.8,LD:.8,ZAG:1,GOL:0};
function who(id,xi){const list=id===S.club?xi:DB.players.filter(p=>p.teamId===id);return wpick(list.length?list:[{name:'Jogador',position:'ATA'}],p=>(WG[p.position]||1)+.2)}
function tick(){if(M.paused||M.done)return;M.min++;const xi=xiP();
Object.values(M.all).flat().forEach(p=>{const sh=strOf(p.h),sa=strOf(p.a);let ph=.0145*Math.exp((sh-sa)/26)*1.08,pa=.0145*Math.exp((sa-sh)/26)/1.08;
[['h',p.h],['a',p.a]].forEach(([s,id])=>{if(id!==S.club)return;const f=S.sty==='Ofensivo'?1.14:S.sty==='Defensivo'?.86:1,d=S.sty==='Ofensivo'?1.1:S.sty==='Defensivo'?.84:1,m=S.mrk==='Forte'?.94:S.mrk==='Leve'?1.04:1;if(s==='h'){ph*=f;pa*=d*m}else{pa*=f;ph*=d*m}});
if(Math.random()<ph){p.hg++;p.ev.push({s:'h',t:'g',m:M.min,n:who(p.h,xi).name})}if(Math.random()<pa){p.ag++;p.ev.push({s:'a',t:'g',m:M.min,n:who(p.a,xi).name})}
if(p===M.p)[['h',p.h],['a',p.a]].forEach(([s,id])=>{if(Math.random()<(S.mrk==='Forte'&&id!==S.club?.0045:.003))p.ev.push({s,t:'y',m:M.min,n:who(id,xi).name})})});
const dr=(S.sty==='Ofensivo'?.55:S.sty==='Defensivo'?.38:.46)+(S.mrk==='Forte'?.08:0);xi.forEach(p=>p.st=Math.max(5,(p.st??100)-dr));
if(M.min===45&&!M.ht){M.ht=true;M.paused=true}if(M.min>=90)fim();render()}
function fim(){M.done=true;clearInterval(M.tm);const p=M.p,me=p.h===S.club,mg=me?p.hg:p.ag,og=me?p.ag:p.hg;
Object.values(M.all).flat().forEach(q=>{const a=S.tab[q.h],b=S.tab[q.a];if(!a||!b)return;a.j++;b.j++;a.gp+=q.hg;a.gc+=q.ag;b.gp+=q.ag;b.gc+=q.hg;if(q.hg>q.ag){a.p+=3;a.v++;b.d++}else if(q.hg<q.ag){b.p+=3;b.v++;a.d++}else{a.p++;b.p++;a.e++;b.e++}});
p.ev.filter(e=>e.t==='g'&&((e.s==='h')===me)).forEach(e=>{const pl=S.pl.find(x=>x.name===e.n);if(pl)S.gl[pl.id]=(S.gl[pl.id]||0)+1});
const o=mg>og?'V':mg<og?'D':'E';S.res.push({r:S.round+1,h:T(p.h).name,a:T(p.a).name,hg:p.hg,ag:p.ag,o});if(S.res.length>60)S.res.shift();
S.cash+=(me?1.2e6:.4e6)+2.2e6+(o==='V'?2.5e6:o==='E'?.9e6:0)-S.pl.reduce((s,x)=>s+wage(x),0)/4;
S.dir=Math.max(0,Math.min(100,S.dir+(o==='V'?3:o==='D'?-4:0)));S.fan=Math.max(0,Math.min(100,S.fan+(o==='V'?4:o==='D'?-5:0)));save()}
/* ---- ações ---- */
const A={go(d){if(M&&!M.done&&d.k==='lineup')M.paused=true;scr=d.k;sel=null;if(scr==='tab')stLg=club().league;render()},
pick(d){fresh(d.id,$('#mg').value.trim());scr='squad';render()},
cont(){try{S=JSON.parse(localStorage.getItem('mirafoot_v3'));scr='squad';render()}catch(e){alert('Save inválido.')}},
play(){startMatch()},
pause(){M.paused=!M.paused;render()},
spd(){M.spd=M.spd===1?2:M.spd===2?4:1;tick0();render()},
skip(){const stop=M.ht||M.min>45?90:45;while(!M.done&&M.min<stop){M.paused=false;tickNoRender()}render()},
end(){S.round++;S.pl.forEach(p=>p.st=Math.min(100,(p.st??100)+25));M=null;save();scr='squad';render()},
back(){scr=M&&!M.done?'match':'squad';sel=null;if(M&&!M.done)tick0();render()},
auto(){const a=assign(S.pl.filter(p=>!M||!M.out.has(p.id)),S.form);S.xi=a.map(p=>p.id);save();render()},
sl(d){const i=+d.i;if(!sel){sel={s:i}}else if(sel.s!=null){const x=S.xi;[x[i],x[sel.s]]=[x[sel.s],x[i]];sel=null;save()}else{sub(i,sel.b)}render()},
bn(d){if(sel&&sel.s!=null){sub(sel.s,d.id)}else sel={b:d.id};render()},
sell(d){const p=S.pl.find(x=>x.id===d.id);if(S.pl.length<=16)return alert('Mantenha pelo menos 16 jogadores.');if(confirm('Vender '+p.name+' por $'+fm(price(p)*.7)+'?')){S.cash+=price(p)*.7;S.pl=S.pl.filter(x=>x!==p);S.xi=S.xi.filter(i=>i!==p.id);save();render()}},
buy(d){const p=DB.players.find(x=>x.id===d.id);if(S.cash<price(p))return alert('Saldo insuficiente.');if(S.pl.length>=30)return alert('Elenco cheio (30).');S.cash-=price(p);S.pl.push({...p,teamId:S.club,st:100});save();render()},
exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='mirafoot-backup.json';a.click()},
imp(){$('#fi').click()},newg(){if(confirm('Começar um novo jogo? A carreira atual será perdida.')){localStorage.removeItem('mirafoot_v3');scr='start';render()}}};
function tickNoRender(){const r=render;render=()=>{};tick();render=r}
function sub(i,id){const p=S.pl.find(x=>x.id===id);if(M&&!M.done){if(M.subs>=5){alert('Limite de 5 substituições.');sel=null;return}if(M.out.has(id)){alert('Jogador já substituído.');sel=null;return}M.subs++;M.out.add(S.xi[i])}S.xi[i]=id;sel=null;save()}
el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
el.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value;
if(c==='stl'){stLg=v}else if(c==='form'){S.form=v;const a=assign(xiP(),v);S.xi=a.map(p=>p.id)}else if(c==='sty')S.sty=v;else if(c==='mrk')S.mrk=v;else if(c==='foc')S.foc=v;else if(c==='mins')S.mins=+v;else if(c==='mpos')filt.pos=v;else if(c==='lg')stLg=v;
if(S)save();render()});
el.addEventListener('input',e=>{if(e.target.id==='mq'){filt.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#mq');n.focus();n.setSelectionRange(p,p)}});
el.addEventListener('change',e=>{if(e.target.id==='fi'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=JSON.parse(t);save();scr='squad';render()}catch(x){alert('Arquivo inválido.')}})}});
fetch('database.json').then(r=>r.json()).then(j=>{DB=j;render()}).catch(()=>{el.innerHTML='<div class="pad"><h2>Não foi possível carregar database.json</h2><p class="mut">Publique index.html e database.json juntos no GitHub Pages (ou use um servidor local). Abrir o arquivo direto pelo celular/PC pode bloquear a leitura.</p></div>'});
</script></body></html>
