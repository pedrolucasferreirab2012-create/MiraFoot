function startMatch(){const all={};ctryLgs().forEach(l=>all[l]=lgPairs(l));const p=all[club().league].find(x=>x.h===S.club||x.a===S.club);if(!p)return;M={all,p,min:0,paused:false,ht:false,done:false,subs:0,out:new Set(),spd:1,tm:null};scr='match';render();tick0()}

[['h',p.h],['a',p.a]].forEach(([s,id])=>{if(id!==S.club)return;const f=S.sty==='Ofensivo'?1.14:S.sty==='Defensivo'?.86:1,d=S.sty==='Ofensivo'?1.1:S.sty==='Defensivo'?.84:1,m=S.mrk==='Forte'?.94:S.mrk==='Leve'?1.04:1;if(s==='h'){ph*=f;pa*=d*m}else{pa*=f;ph*=d*m}});

function post(q){const a=S.tab[q.h],b=S.tab[q.a];if(!a||!b)return;a.j++;b.j++;a.gp+=q.hg;a.gc+=q.ag;b.gp+=q.ag;b.gc+=q.hg;if(q.hg>q.ag){a.p+=3;a.v++;b.d++}else if(q.hg<q.ag){b.p+=3;b.v++;a.d++}else{a.p++;b.p++;a.e++;b.e++}}
