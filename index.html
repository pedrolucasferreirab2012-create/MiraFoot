<style>
:root{--bg:#09131f;--p:#132338;--p2:#1a2e45;--line:#30455e;--txt:#edf5ff;--muted:#a3b5c9;--green:#42d9a0;--gold:#f4ca70;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193a50,#0a1725 55%,#07101a);color:var(--txt);font:14px/1.5 system-ui,Arial}
header{position:sticky;top:0;z-index:5;background:#091522ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:27px;font-weight:950;letter-spacing:-1px}.logo span{color:var(--green)}.muted{color:var(--muted)}.tiny{font-size:11px}
button,select,input{font:inherit;color:var(--txt);background:#20364e;border:1px solid #3b5875;border-radius:10px;padding:9px 12px}button{cursor:pointer}button.primary{background:var(--green);color:#06251b;border:0;font-weight:850}button:hover{filter:brightness(1.12)}nav{display:flex;gap:5px;padding:10px 14px;background:#0d1b2b;border-bottom:1px solid var(--line);overflow:auto}nav button{white-space:nowrap;background:transparent;border-color:transparent;color:var(--muted)}nav button.active{background:var(--p2);border-color:var(--line);color:white}
main{max-width:1200px;margin:auto;padding:17px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}.card{grid-column:span 6;background:linear-gradient(145deg,#15283d,#101d2e);border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}h1{font-size:24px;margin:0 0 13px}h2{font-size:17px;margin:0 0 12px}.big{font-size:27px;font-weight:900}.green{color:var(--green)}.gold{color:var(--gold)}.pill{display:inline-block;background:#203850;border:1px solid #385570;border-radius:20px;padding:3px 8px;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#0c1928;border:1px solid var(--line);border-radius:11px;padding:10px}.stat small{display:block;color:var(--muted)}.stat b{font-size:18px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px 5px;border-bottom:1px solid #2b3e54}th{font-size:11px;color:var(--muted)}.right{text-align:right}.ov{font-weight:900;color:var(--gold)}.scroll{overflow:auto}.notice{padding:10px 12px;border:1px solid #27604f;background:#102f2a;border-radius:10px;color:#aaf1d7;margin:9px 0}.warn{background:#342a1b;border-color:#6b552f;color:#ffe3a5}.pitch{background:linear-gradient(#176344,#0c4934);border:2px solid #63bd93;border-radius:13px;padding:11px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.slot{border:1px dashed #a4dfc1;border-radius:8px;padding:6px;text-align:center;font-size:11px;min-width:0}.slot select{width:100%;padding:4px;font-size:10px;background:#0d392b}.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.field label{color:var(--muted);font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;padding:20px;color:var(--muted)}footer{text-align:center;padding:18px;color:#7187a0;font-size:11px}
@media(max-width:740px){main{padding:11px}.card,.s7,.s5{grid-column:span 12}.pitch{grid-template-columns:repeat(2,minmax(0,1fr))}table{font-size:12px}td,th{padding:7px 3px}.stat{padding:8px}.stat b{font-size:15px}}

/* MiraFoot Manager: interface clássica de simulador de futebol */
:root{--bg:#cbd5df;--p:#e8edf2;--p2:#d6e0e9;--line:#8296a9;--txt:#152b40;--muted:#52677a;--green:#16824e;--gold:#9a6810;--red:#a42d32}
body{background:#b9c6d2;color:#172d42;font:13px/1.4 Tahoma,Arial,sans-serif}
header{background:linear-gradient(#234a6d,#173753);color:#fff;border-bottom:2px solid #0d253a;padding:9px 14px;min-height:62px}
.logo{font-size:25px;letter-spacing:-.8px}.logo span{color:#78e1a7}header .muted{color:#c5d6e5}header .pill{background:#315775;border-color:#62809a;color:#fff}
nav{position:fixed;z-index:4;left:0;top:62px;bottom:0;width:184px;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:10px 8px;background:linear-gradient(#dfe6ed,#c7d2dd);border-right:1px solid #71879b;overflow:auto}
nav button{text-align:left;border-radius:3px;padding:10px 11px;color:#19354d;border:1px solid transparent;background:transparent;font-weight:700}
nav button:hover{background:#edf3f8;border-color:#9aabba}nav button.active{background:linear-gradient(#3c7198,#285476);border-color:#1a405e;color:white;box-shadow:inset 0 1px #8eb3cf}
main{max-width:none;margin:0 0 0 184px;padding:15px 17px 28px}
.card{background:linear-gradient(#f7f9fb,#e3eaf0);border:1px solid #879bad;border-radius:3px;padding:12px;box-shadow:0 1px 2px #61748744}
.card h2{padding-bottom:7px;border-bottom:1px solid #bdc9d4;color:#1c405e;font-size:14px;text-transform:uppercase;letter-spacing:.25px}
h1{font-size:21px;color:#183d5b;border-bottom:2px solid #66869f;padding-bottom:8px}
button,select,input{background:linear-gradient(#fff,#e0e7ed);color:#18334b;border:1px solid #7e94a8;border-radius:3px;padding:7px 9px}
button{font-weight:700}button.primary{background:linear-gradient(#368d61,#176b43);color:#fff;border:1px solid #155536;text-shadow:0 1px #174d35}
button:hover{filter:brightness(1.04)}
nav button{font-size:13px}.stat{background:#f7fafc;border:1px solid #b0bfcc;border-radius:3px}.stat small{color:#52677a}
.pill{background:#d8e4ed;border:1px solid #a4b5c4;border-radius:3px;color:#29475f}
table{font-size:12px}td,th{border-bottom:1px solid #c5d0d9;padding:7px 6px}th{background:#d7e1e9;color:#29465f;position:sticky;top:0}tbody tr:nth-child(even){background:#edf2f6}tbody tr:hover{background:#d9e9f5}
.scroll{border:1px solid #b1bfca;background:#f8fafb}.notice{border-radius:3px;background:#d9eee3;border-color:#80b49a;color:#205a3c}.warn{background:#f7ead0;border-color:#c5a96d;color:#684b14}
.pitch{position:relative;display:block;height:450px;max-width:680px;margin:10px auto;background:repeating-linear-gradient(0deg,#28764d 0 56px,#236e47 56px 112px);border:3px solid #e4f0e6;border-radius:2px;overflow:hidden}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #d7f0df;opacity:.85}.pitch:after{content:"";position:absolute;width:116px;height:116px;border:2px solid #d7f0df;border-radius:50%;left:calc(50% - 58px);top:calc(50% - 58px);opacity:.85;pointer-events:none}
.pitch .slot{position:absolute;width:29%;max-width:170px;transform:translate(-50%,-50%);background:#f2f7f4;border:1px solid #c2d9c8;border-radius:4px;padding:4px;color:#183c2b;z-index:1;box-shadow:0 2px 5px #102b1b88}
.pitch .slot b{display:block;font-size:10px}.pitch .slot select{width:100%;padding:3px;font-size:10px;background:#fff;color:#18334b}
.pitch .slot small{display:block;font-size:9px;color:#45634f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field{gap:7px}.field label{color:#344f66;font-weight:700}
.match-shell{max-width:1000px;margin:auto}.scoreboard{background:linear-gradient(#183d5d,#0d2b45);color:#fff;border:2px solid #7896ad;padding:18px;border-radius:3px;text-align:center}.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.scoreline strong{font-size:clamp(17px,3vw,25px)}.score{font-size:42px;font-weight:900;letter-spacing:2px;color:#fff}.match-clock{font-size:18px;color:#bce8d0;font-weight:900}.event-feed{height:330px;overflow:auto;background:#f9fbfc;border:1px solid #9bafbf;padding:8px}.event{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:7px;border-bottom:1px solid #d3dce4}.event:nth-child(even){background:#edf2f6}.event time{font-weight:900;color:#1d5a82}.event.goal{background:#e0f3e7}.event.card-event{background:#fff1d5}.event.sub-event{background:#e7eafa}.sub-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin:7px 0}
@media(max-width:740px){nav{top:auto;bottom:0;left:0;right:0;width:auto;height:66px;flex-direction:row;align-items:stretch;padding:5px;overflow-x:auto;border-right:0;border-top:1px solid #71879b}nav button{min-width:max-content;text-align:center;padding:8px 10px;font-size:11px}main{margin:0;padding:11px 10px 82px}.pitch{height:420px}.pitch .slot{width:31%;}.scoreboard{padding:12px}.score{font-size:34px}.event-feed{height:280px}}

</style></head><body><header><div><div class="logo">Mira<span>Foot</span></div><div class="muted tiny">MANAGER DE FUTEBOL • BASE OFFLINE 2026</div></div><div class="row"><span class="pill" id="season">Temporada 2026</span><button id="new">Nova carreira</button></div></header><nav id="nav"></nav><main id="app"></main><footer>MiraFoot • Banco de dados incorporado • Sem API e sem conexão externa durante o jogo</footer>
<script>
let DB, S, page="home", matchTimer=null, matchPaused=false, activeMatch=null;
const $=x=>document.querySelector(x), money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const tabs=[["home","Painel"],["club","Escolher clube"],["squad","Elenco e escalações"],["market","Mercado"],["competitions","Competições"],["finance","Finanças"],["settings","Configurações"],["database","Base de dados"]];
fetch("database.json").then(r=>r.json()).then(db=>{DB=db;init()}).catch(()=>{$("#app").innerHTML="<div class='notice warn'>Não foi possível carregar database.json. Confirme que os dois arquivos estão na mesma pasta do GitHub Pages.</div>"});
function fresh(){return {season:2026,clubId:null,players:[],cash:50000000,round:0,w:0,d:0,l:0,log:[],preset:"Titular",presets:{Titular:[],Reservas:[],Copa:[]},formation:"4-3-3",settings:{matchMinutes:5}}}
function init(){try{S=JSON.parse(localStorage.getItem("mirafoot_offline"))||fresh()}catch{S=fresh()}S.settings ||= {matchMinutes:5};if(!S.settings.matchMinutes)S.settings.matchMinutes=5;if(S.clubId&&!S.players.length)selectClub(S.clubId,false);render()}
function save(){localStorage.setItem("mirafoot_offline",JSON.stringify(S))}
function team(id){return DB.teams.find(t=>t.id===id)}
function club(){return team(S.clubId)}
function avg(a){return a.length?Math.round(a.reduce((s,p)=>s+p.overall,0)/a.length):0}
function xi(){let ids=S.presets[S.preset]||[];let chosen=ids.map(id=>S.players.find(p=>p.id===id)).filter(Boolean);return chosen.length?chosen:S.players.slice().sort((a,b)=>b.overall-a.overall).slice(0,11)}
function nav(){ $("#nav").style.display=page==="match"?"none":"flex";document.querySelector("main").style.marginLeft=page==="match"?"0":"";$("#nav").innerHTML=tabs.map(([id,n])=>`<button class="${page===id?"active":""}" data-p="${id}">${n}</button>`).join("");document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{page=b.dataset.p;render()})}
function box(t,h,c=""){return `<section class="card ${c}"><h2>${t}</h2>${h}</section>`}
function home(){if(!club())return `<div class="notice">Bem-vindo ao MiraFoot! Escolha um clube para iniciar sua carreira.</div><button class="primary" data-go="club">Escolher clube</button>`;let next=DB.teams.filter(t=>t.id!==S.clubId)[S.round%Math.max(1,DB.teams.length-1)];return `<h1>${club().name}</h1><div class="grid">${box(`<div class="row"><span>Resumo da temporada</span><span class="pill">OVR ${avg(xi())}</span></div>`, `<div class="stats"><div class="stat"><small>Vitórias</small><b>${S.w}</b></div><div class="stat"><small>Empates</small><b>${S.d}</b></div><div class="stat"><small>Derrotas</small><b>${S.l}</b></div></div><div class="big green">${money(S.cash)}</div><div class="muted">Saldo do clube</div>`,"s7")}
${box("Próxima partida",`<div class="row"><b>${club().name}</b><span class="big">×</span><b>${next?.name||"Adversário"}</b></div><p class="muted">Escalação ativa: ${S.preset} • Duração: ${S.settings?.matchMinutes||5} min</p>${activeMatch?`<div class="notice" id="matchStatus">Partida em andamento...</div><div class="row"><b id="matchClock">${activeMatch.minute}' / 90'</b><span class="muted" id="matchRemaining">${activeMatch.remaining}s restantes</span></div><div style="height:9px;background:#071421;border-radius:9px;overflow:hidden;margin:8px 0 12px"><div id="matchProgress" style="height:100%;width:${activeMatch.minute/90*100}%;background:var(--green)"></div></div><button id="returnMatch" class="primary">Voltar à partida</button> <button id="pauseMatch">${matchPaused?"Continuar":"Pausar"}</button>`:`<button class="primary" id="play">Iniciar partida</button>`}`,"s5")}
${box("Últimos resultados",S.log.length?`<table><tbody>${S.log.slice(-6).reverse().map(x=>`<tr><td>${x.home}</td><td><b>${x.score}</b></td><td>${x.away}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">Nenhum jogo disputado.</div>`,"s12")}</div>`}
function clubPage(){let leagues=[...new Set(DB.teams.map(t=>t.league))];return `<h1>Escolha seu clube</h1><div class="grid">${box("Clubes disponíveis",`<div class="field"><label>Competição</label><select id="filter"><option value="">Todas</option>${leagues.map(l=>`<option>${l}</option>`).join("")}</select></div><div class="scroll"><table id="clubs"><tbody>${DB.teams.map(t=>`<tr data-league="${t.league}"><td><b>${t.name}</b><div class="muted tiny">${t.league} • ${t.country}</div></td><td class="right"><span class="pill">Força ${t.strength}</span></td><td class="right"><button data-club="${t.id}">Escolher</button></td></tr>`).join("")}</tbody></table></div>`,"s12")}</div>`}
function selectClub(id,ask=true){let t=team(id);if(!t)return;if(ask&&S.clubId&&!confirm("Trocar de clube? Isso inicia uma nova carreira com o elenco desse clube."))return;S.clubId=id;S.players=DB.players.filter(p=>p.teamId===id).map(p=>({...p}));S.cash= Math.max(8000000,t.strength*1100000);S.round=0;S.w=S.d=S.l=0;S.log=[];S.presets={Titular:[],Reservas:[],Copa:[]};S.preset="Titular";save();page="home";render()}
function formationShape(f){const shapes={"4-3-3":[[50,88],[20,69],[40,73],[60,73],[80,69],[30,49],[50,54],[70,49],[18,24],[50,18],[82,24]],"4-4-2":[[50,88],[20,69],[40,73],[60,73],[80,69],[18,49],[39,52],[61,52],[82,49],[36,22],[64,22]],"4-2-3-1":[[50,88],[20,69],[40,73],[60,73],[80,69],[38,58],[62,58],[18,34],[50,30],[82,34],[50,15]],"3-5-2":[[50,88],[30,72],[50,74],[70,72],[12,48],[32,52],[50,55],[68,52],[88,48],[36,22],[64,22]]};return shapes[f]||shapes["4-3-3"]}
function currentXI(){let ids=S.presets[S.preset]||[];let a=ids.map(id=>S.players.find(p=>p.id===id)).filter(Boolean);if(a.length!==11)a=S.players.slice().sort((x,y)=>y.overall-x.overall).slice(0,11);return a}
function squad(){if(!club())return `<div class="notice">Escolha um clube primeiro.</div>`;let selected=currentXI(),shape=formationShape(S.formation);return `<h1>Elenco e escalação</h1><div class="grid">${box("Quadro tático • escalação titular",`<div class="field"><label>Escalação</label><select id="preset">${Object.keys(S.presets).map(p=>`<option ${S.preset===p?"selected":""}>${p}</option>`).join("")}</select><label>Formação</label><select id="formation">${["4-3-3","4-4-2","4-2-3-1","3-5-2"].map(f=>`<option ${S.formation===f?"selected":""}>${f}</option>`).join("")}</select><button id="saveXI" class="primary">Salvar escalação</button></div><div class="pitch">${selected.map((p,i)=>`<div class="slot" style="left:${shape[i][0]}%;top:${shape[i][1]}%"><b>${["GOL","DEF","DEF","DEF","DEF","MEI","MEI","MEI","ATA","ATA","ATA"][i]}</b><small>${p.name} • OVR ${p.overall}</small><select data-slot="${i}">${S.players.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${x.name} (${x.overall})</option>`).join("")}</select></div>`).join("")}</div><div class="notice">Toque no jogador dentro do campo para trocar a posição. A formação reorganiza os atletas automaticamente.</div>` ,"s7")}${box("Resumo do elenco",`<div class="stats"><div class="stat"><small>Jogadores</small><b>${S.players.length}</b></div><div class="stat"><small>Força titular</small><b>${avg(selected)}</b></div><div class="stat"><small>Formação</small><b>${S.formation}</b></div></div><p class="muted">Escolha o atleta diretamente no campo. Cada escalação pode ser salva separadamente.</p>` ,"s5")}${box("Todos os jogadores",S.players.length?`<div class="scroll"><table><thead><tr><th>Jogador</th><th>Pos.</th><th>Idade</th><th class="right">OVR</th></tr></thead><tbody>${S.players.slice().sort((a,b)=>b.overall-a.overall).map(p=>`<tr><td>${p.name} ${p.real?"<span class=pill>Real</span>":""}</td><td>${p.position}</td><td>${p.age||"—"}</td><td class="right ov">${p.overall}</td></tr>`).join("")}</tbody></table></div>`:`<div class="notice warn">Este clube ainda não tem jogadores cadastrados.</div>`,"s12")}</div>`}
function market(){let pool=DB.players.filter(p=>p.teamId!==S.clubId&&!S.players.some(x=>x.id===p.id));return `<h1>Mercado de transferências</h1><div class="grid">${box("Pesquisa de jogadores",`<div class="field"><label>Nome</label><input id="marketName" placeholder="Pesquisar jogador..." style="min-width:190px"><label>Posição</label><select id="marketPos"><option value="">Todas</option>${[...new Set(DB.players.map(p=>p.position))].sort().map(x=>`<option>${x}</option>`).join("")}</select><label>Overall mínimo</label><select id="marketMin">${[0,50,60,65,70,75,80,85,90].map(n=>`<option value="${n}">${n===0?"Qualquer":n+"+"}</option>`).join("")}</select><label>Overall máximo</label><select id="marketMax">${[100,99,95,90,85,80,75,70,65].map(n=>`<option value="${n}">${n}</option>`).join("")}</select><button id="marketClear">Limpar filtros</button></div><div class="row"><span class="muted" id="marketCount">${pool.length} jogadores encontrados</span><span class="pill">Saldo: ${money(S.cash)}</span></div><div class="scroll"><table><thead><tr><th>Jogador</th><th>Clube</th><th>Pos.</th><th>OVR</th><th>Preço</th><th></th></tr></thead><tbody id="marketRows"></tbody></table></div>` ,"s12")}</div>`}
function filterMarket(){let q=(document.querySelector("#marketName")?.value||"").toLocaleLowerCase("pt-BR"),pos=document.querySelector("#marketPos")?.value||"",min=Number(document.querySelector("#marketMin")?.value||0),max=Number(document.querySelector("#marketMax")?.value||100);let pool=DB.players.filter(p=>p.teamId!==S.clubId&&!S.players.some(x=>x.id===p.id)&&p.name.toLocaleLowerCase("pt-BR").includes(q)&&(!pos||p.position===pos)&&p.overall>=min&&p.overall<=max).sort((a,b)=>b.overall-a.overall);let rows=document.querySelector("#marketRows");if(!rows)return;rows.innerHTML=pool.map(p=>`<tr><td><b>${p.name}</b></td><td>${team(p.teamId)?.name||"—"}</td><td>${p.position}</td><td class="ov">${p.overall}</td><td>${money(p.overall*p.overall*1700)}</td><td><button data-buy="${p.id}">Contratar</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">Nenhum jogador corresponde aos filtros.</td></tr>`;document.querySelector("#marketCount").textContent=pool.length+" jogadores encontrados";document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy))}
function competitions(){return `<h1>Competições e regulamentos 2026</h1><div class="grid">${DB.regulations.map(r=>box(r.name,`<p>${r.format}</p>${r.promotion?`<p><b>Acesso:</b> ${r.promotion}</p>`:""}${r.relegation?`<p><b>Rebaixamento:</b> ${r.relegation}</p>`:""}${r.continental?`<p><b>Vagas:</b> ${r.continental}</p>`:""}`,"s12")).join("")}<section class="card s12"><h2>Grupos da Série D 2026</h2><div class="grid">${Object.entries(DB.serieDGroups).map(([g,teams])=>`<div class="card"><b>Grupo ${g}</b><ol>${teams.map(t=>`<li>${t}</li>`).join("")}</ol></div>`).join("")}</div></section></div>`}
function finance(){let wages=S.players.reduce((s,p)=>s+p.overall*p.overall*5,0);return `<h1>Finanças</h1><div class="grid">${box("Orçamento",`<div class="big green">${money(S.cash)}</div><div class="stats"><div class="stat"><small>Folha semanal estimada</small><b>${money(wages)}</b></div><div class="stat"><small>Bilheteria por jogo em casa</small><b>${money(1200000)}</b></div><div class="stat"><small>Patrocínio por rodada</small><b>${money(2200000)}</b></div></div><p>Receitas: bilheteria, patrocínios, direitos de TV, premiações e vendas.</p><p>Despesas: salários, bônus, contratações e melhorias do clube.</p>`,"s12")}</div>`}
function settings(){let mins=S.settings?.matchMinutes||5;return `<h1>Configurações</h1><div class="grid">${box("Duração das partidas",`<p class="muted">Escolha quanto tempo uma partida leva na vida real. O relógio da partida vai de 0 a 90 minutos durante esse período.</p><div class="field"><label for="matchMinutes">Tempo de cada partida</label><select id="matchMinutes">${[1,3,5,8,10,15,20].map(n=>`<option value="${n}" ${mins===n?"selected":""}>${n} ${n===1?"minuto":"minutos"}</option>`).join("")}</select></div><div class="notice">Configuração atual: <b>${mins} ${mins===1?"minuto":"minutos"}</b> por partida. A alteração vale para os próximos jogos e fica salva neste dispositivo.</div><p class="muted tiny">Dica: 1–3 minutos para partidas rápidas; 5–10 para uma experiência equilibrada; 15–20 para acompanhar com mais calma.</p><button class="primary" id="saveSettings">Salvar configurações</button>` ,"s12")}${box("Preferências salvas",`<p>As configurações e o progresso da carreira são guardados automaticamente no armazenamento local do navegador.</p><p class="muted tiny">Se limpar os dados do navegador ou trocar de aparelho, exporte um backup na aba Base de dados para não perder sua carreira.</p>` ,"s12")}</div>`}
function database(){let counts={};DB.teams.forEach(t=>counts[t.league]=(counts[t.league]||0)+1);return `<h1>Base offline MiraFoot 2026</h1><div class="grid">${box("Conteúdo incluído",`<div class="stats"><div class="stat"><small>Clubes</small><b>${DB.teams.length}</b></div><div class="stat"><small>Jogadores reais</small><b>${DB.players.length}</b></div><div class="stat"><small>Grupos Série D</small><b>16</b></div></div><table><tbody>${Object.entries(counts).map(([k,v])=>`<tr><td>${k}</td><td class="right">${v} clubes</td></tr>`).join("")}</tbody></table><div class="notice">A base é incorporada ao site: o jogo não chama API. Elencos completos de todas as divisões não estão disponíveis nesta edição; os nomes marcados como reais foram selecionados de listas oficiais publicadas para 2026/27 e estatísticas CBF 2026. Overalls, valores e salários são notas econômicas criadas pelo MiraFoot.</div><button id="export">Exportar backup da carreira</button> <button id="import">Importar backup</button><input type="file" id="file" accept="application/json" hidden>`,"s12")}</div>`}
function matchPage(){if(!activeMatch)return `<h1>Partida</h1><div class="notice">Nenhuma partida em andamento.</div><button data-go="home">Voltar ao painel</button>`;let m=activeMatch;return `<div class="match-shell"><div class="row"><h1>Partida ao vivo</h1><button id="exitMatch">Voltar ao painel</button></div><div class="scoreboard"><div class="scoreline"><strong>${m.home}</strong><div><div class="score" id="liveScore">${m.myGoals} × ${m.theirGoals}</div><div class="match-clock" id="matchClock">${m.minute}'</div></div><strong>${m.opponent.name}</strong></div><div class="muted" style="color:#c3d6e5" id="matchStatus">${matchPaused?"PAUSADA":"EM ANDAMENTO"}</div><div style="height:9px;background:#061b2c;margin-top:12px"><div id="matchProgress" style="height:100%;width:${m.minute/90*100}%;background:#5be0a0"></div></div><div class="row" style="margin-top:8px"><span id="matchRemaining">${m.remaining}s restantes</span><button id="pauseMatch">${matchPaused?"Continuar":"Pausar"}</button></div></div><div class="grid" style="margin-top:12px">${box("Narração da partida",`<div class="event-feed" id="eventFeed">${m.events.slice().reverse().map(e=>`<div class="event ${e.kind||""}"><time>${e.minute}'</time><span>${e.text}</span></div>`).join("")}</div>` ,"s7")}${box("Substituições e banco",`<p class="muted">Faça alterações durante a partida. O jogador que entra assume a vaga do escolhido.</p><div class="field"><label>Sai</label><select id="subOut">${m.lineup.map(p=>`<option value="${p.id}">${p.name} (${p.position})</option>`).join("")}</select></div><div class="field"><label>Entra</label><select id="subIn">${S.players.filter(p=>!m.lineup.some(x=>x.id===p.id)).map(p=>`<option value="${p.id}">${p.name} (${p.position}) • ${p.overall}</option>`).join("")}</select></div><button class="primary" id="makeSub">Confirmar substituição</button><div class="notice" id="subStatus">${m.subs||0}/5 substituições utilizadas</div>` ,"s5")}${box("Estatísticas",`<div class="stats"><div class="stat"><small>Finalizações</small><b id="shots">${m.shotsFor}</b></div><div class="stat"><small>Amarelos</small><b id="yellows">${m.yellows}</b></div><div class="stat"><small>Substituições</small><b id="subsCount">${m.subs||0}</b></div></div><p class="muted">Duração configurada: ${S.settings.matchMinutes} minuto(s) reais.</p>` ,"s12")}</div></div>`}
function addEvent(text,kind=""){if(!activeMatch)return;activeMatch.events.push({minute:activeMatch.minute,text,kind});if(activeMatch.events.length>80)activeMatch.events.shift();let feed=document.querySelector("#eventFeed");if(feed){feed.innerHTML=activeMatch.events.slice().reverse().map(e=>`<div class="event ${e.kind||""}"><time>${e.minute}'</time><span>${e.text}</span></div>`).join("")}}
function minuteEvents(){let m=activeMatch;if(!m)return;let r=Math.random(),diff=(m.my-m.their)/100,pHome=Math.max(.018,Math.min(.065,.032+diff*.025)),pAway=Math.max(.015,Math.min(.06,.030-diff*.02));if(r<pHome){m.myGoals++;m.shotsFor++;addEvent(`GOOOOOOL! ${m.lineup[Math.floor(Math.random()*m.lineup.length)]?.name||"O atacante"} marca para ${m.home}!`,"goal");let sc=document.querySelector("#liveScore");if(sc)sc.textContent=m.myGoals+" × "+m.theirGoals}else if(r<pHome+pAway){m.theirGoals++;m.shotsAgainst++;addEvent(`GOL DO ADVERSÁRIO! ${m.opponent.name} balança as redes.`,"goal");let sc=document.querySelector("#liveScore");if(sc)sc.textContent=m.myGoals+" × "+m.theirGoals}else if(r<.16){m.yellows++;let who=m.lineup[Math.floor(Math.random()*m.lineup.length)];addEvent(`Cartão amarelo para ${who?.name||"um jogador"}, por falta no meio-campo.`,"card-event");let y=document.querySelector("#yellows");if(y)y.textContent=m.yellows}else if(r<.31){m.shotsFor++;addEvent(`Boa chegada do ${m.home}! A defesa adversária consegue afastar o perigo.`);let sh=document.querySelector("#shots");if(sh)sh.textContent=m.shotsFor}else if(r<.40){m.shotsAgainst++;addEvent(`${m.opponent.name} chega ao ataque, mas a finalização vai para fora.`);let sh=document.querySelector("#shots");if(sh)sh.textContent=m.shotsFor}else if(r<.45){addEvent("O árbitro marca falta. O jogo fica parado por alguns instantes.")} }
function tickMatch(){if(!activeMatch||matchPaused)return;let m=activeMatch;m.remaining--;let old=m.minute;m.minute=Math.min(90,Math.floor((m.total-m.remaining)/m.total*90));if(m.minute>old){if(m.minute===45)addEvent("Intervalo! As equipes vão para o vestiário.");else minuteEvents()}updateMatchClock();if(m.remaining<=0)finishMatch()}
const views={home,club:clubPage,squad,market,competitions,finance,settings,database,match:matchPage};
function render(){nav();save();$("#app").innerHTML=views[page]();document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});
if(page==="club"){$("#filter").onchange=e=>document.querySelectorAll("#clubs tr").forEach(r=>r.style.display=!e.target.value||r.dataset.league===e.target.value?"":"none");document.querySelectorAll("[data-club]").forEach(b=>b.onclick=()=>selectClub(b.dataset.club))}
if(page==="squad"&&club()){$("#preset").onchange=e=>{S.preset=e.target.value;render()};$("#formation").onchange=e=>{S.formation=e.target.value;save();render()};document.querySelectorAll("[data-slot]").forEach(sel=>sel.onchange=()=>{let ids=[...document.querySelectorAll("[data-slot]")].map(x=>x.value);if(new Set(ids).size!==11){alert("Cada jogador só pode ocupar uma posição.");render();return}S.presets[S.preset]=ids;save();render()});$("#saveXI").onclick=()=>{let ids=[...document.querySelectorAll("[data-slot]")].map(s=>s.value);if(ids.length!==11||new Set(ids).size!==11){alert("Selecione 11 jogadores diferentes.");return}S.presets[S.preset]=ids;save();alert("Escalação salva!");render()}}
if(page==="market"){["#marketName","#marketPos","#marketMin","#marketMax"].forEach(q=>$(q).addEventListener(q==="#marketName"?"input":"change",filterMarket));$("#marketClear").onclick=()=>{$("#marketName").value="";$("#marketPos").value="";$("#marketMin").value="0";$("#marketMax").value="100";filterMarket()};filterMarket()}
if(page==="home"&&club()&&!activeMatch)$("#play").onclick=play;
if(page==="home"&&activeMatch){let pb=$("#pauseMatch");if(pb)pb.onclick=togglePause;let rb=$("#returnMatch");if(rb)rb.onclick=()=>{page="match";render()}}
if(page==="match"&&activeMatch){$("#pauseMatch").onclick=togglePause;$("#exitMatch").onclick=()=>{page="home";render()};$("#makeSub").onclick=()=>{let m=activeMatch;if(m.subs>=5){alert("Limite de cinco substituições atingido.");return}let out=m.lineup.findIndex(p=>p.id===$("#subOut").value),incoming=S.players.find(p=>p.id===$("#subIn").value);if(out<0||!incoming)return;let old=m.lineup[out];m.lineup[out]=incoming;m.subs=(m.subs||0)+1;addEvent(`Substituição: ${old.name} sai, ${incoming.name} entra.`,"sub-event");render();}}
if(page==="settings"){$("#saveSettings").onclick=()=>{S.settings.matchMinutes=Number($("#matchMinutes").value)||5;save();alert("Configurações salvas!");render()}}
if(page==="database"){$("#export").onclick=()=>download(JSON.stringify(S,null,2),"mirafoot-backup.json");$("#import").onclick=()=>$("#file").click();$("#file").onchange=async e=>{try{S=JSON.parse(await e.target.files[0].text());save();render();alert("Backup importado.")}catch{alert("Backup inválido.")}}}
}
function buy(id){let p=DB.players.find(x=>x.id===id);if(!p)return;let price=p.overall*p.overall*1700;if(S.cash<price){alert("Saldo insuficiente.");return}if(S.players.length>=30){alert("Elenco cheio.");return}S.cash-=price;S.players.push({...p,id:p.id+"_"+Date.now(),teamId:S.clubId});save();alert(p.name+" contratado!");render()}
function play(){if(!club()||activeMatch)return;let opponents=DB.teams.filter(t=>t.id!==S.clubId);let o=opponents[S.round%opponents.length];let lineup=currentXI();activeMatch={opponent:o,home:club().name,total:(S.settings?.matchMinutes||5)*60,remaining:(S.settings?.matchMinutes||5)*60,minute:0,my:avg(lineup)||club().strength,their:o.strength,myGoals:0,theirGoals:0,shotsFor:0,shotsAgainst:0,yellows:0,subs:0,lineup:lineup.map(p=>({...p})),events:[{minute:0,text:"Bola rolando! Começa a partida no estádio.",kind:""}]};matchPaused=false;page="match";render();matchTimer=setInterval(tickMatch,1000)}
function updateMatchClock(){let c=$("#matchClock"),r=$("#matchRemaining"),p=$("#matchProgress");if(c)c.textContent=activeMatch.minute+"' / 90'";if(r)r.textContent=activeMatch.remaining+"s restantes";if(p)p.style.width=(activeMatch.minute/90*100)+"%"}
function togglePause(){matchPaused=!matchPaused;let b=$("#pauseMatch");if(b)b.textContent=matchPaused?"Continuar":"Pausar";let st=$("#matchStatus");if(st)st.textContent=matchPaused?"PAUSADA":"EM ANDAMENTO"}
function poisson(lambda){let L=Math.exp(-lambda),k=0,prod=1;do{k++;prod*=Math.random()}while(prod>L);return k-1}
function finishMatch(){clearInterval(matchTimer);matchTimer=null;let m=activeMatch;let homeGoals=m.myGoals,awayGoals=m.theirGoals;addEvent("Fim de jogo! O árbitro encerra a partida.");S.round++;if(homeGoals>awayGoals)S.w++;else if(homeGoals===awayGoals)S.d++;else S.l++;let wages=S.players.reduce((s,p)=>s+p.overall*p.overall*5,0);S.cash+=1200000+2200000+(homeGoals>awayGoals?2500000:homeGoals===awayGoals?900000:0)-wages;S.log.push({home:m.home,away:m.opponent.name,score:homeGoals+" × "+awayGoals,duration:(S.settings?.matchMinutes||5)+" min"});if(S.log.length>50)S.log.shift();activeMatch=null;matchPaused=false;save();page="home";render();alert("Fim de jogo! "+m.home+" "+homeGoals+" × "+awayGoals+" "+m.opponent.name)}
function download(data,name){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
$("#new").onclick=()=>{if(confirm("Começar uma nova carreira? Exporte o backup antes se quiser guardar o progresso.")){S=fresh();save();page="club";render()}}
</script></body></html>
