function initClub(){const t=club();S.cap=Math.round((6000+t.strength*t.strength*7)/500)*500;S.tkt='Normal';S.train='Físico';S.sp={master:null,mat:null,man:null,cos:null,sho:null};['master','mat'].forEach(k=>S.sp[k]=brandOffers(k).sort((a,b)=>b.v-a.v)[0]);S.led={};S.tot={g:0,s:0,p:0,w:0,f:0,i:0};S.gl={};S.cel=[];S.pl.forEach(p=>{p.mor??=75;p.fm??=0;p.vm??=1;p.bn=0;p.inj??=0});buildComps()}
function money(home,o,cup){const t=club(),k=S.tkt||'Normal',pr={Baixo:.75,Normal:1,Alto:1.3}[k],at={Baixo:1.12,Normal:1,Alto:.85}[k];let g=0,s=0,w=0,f=0,ins=0,pz=0;
if(home)g=Math.min(S.cap,S.cap*(.25+.7*S.fan/100)*at*(.9+Math.random()*.2))*(6+t.strength*.15)*pr*(cup?1.3:1);
if(!cup){const sp=Object.values(S.sp).filter(Boolean),sv=sp.reduce((a,x)=>a+x.v,0),sw=sp.reduce((a,x)=>a+x.w,0);s=sv*(.6+.4*S.dir/100)+(o==='V'?sw:0);w=S.pl.reduce((a,p)=>a+wage(p),0)/4;f=S.cap*6;S.debts=S.debts.filter(d=>{ins+=d.amt;d.left--;return d.left>0})}else pz=(o==='V'?2.5e6:o==='E'?1e6:0)*cup*3;
const net=g+s+pz-w-f-ins;S.cash+=net;S.led={g,s,p:pz,w,f,i:ins,net};['g','s','p','w','f','i'].forEach(q=>S.tot[q]=(S.tot[q]||0)+S.led[q])}
let LN={m:20,n:12};const LNT=[[4,'1 mês (4 rodadas)'],[12,'3 meses (12 rodadas)'],[24,'6 meses (24 rodadas)'],[48,'1 ano (48 rodadas)']];
function loanQ(m,n){const rate=5+m*.32+n*.22+S.debts.length*1.2,tot=m*1e6*(1+rate/100);return{rate,tot,inst:tot/n}}
function vFin(){const L=S.led||{},Tt=S.tot||{},r=(a,v)=>`<tr><td style="text-align:left">${a}</td><td style="text-align:right" class="${v<0?'red':''}">${v<0?'-':''}$${fm(Math.abs(v||0))}</td></tr>`,tb=o=>`<table>${r('Bilheteria',o.g)}${r('Patrocínio',o.s)}${r('Premiações',o.p)}${r('Salários',-(o.w||0))}${r('Despesas do estádio',-(o.f||0))}${r('Parcelas',-(o.i||0))}${r('Saldo',o.net!==undefined?o.net:((o.g||0)+(o.s||0)+(o.p||0)-(o.w||0)-(o.f||0)-(o.i||0)))}</table>`,op=(L,v)=>L.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join(''),q=loanQ(LN.m,LN.n);
return `<div class="top"><div><h1>Finanças</h1><small>Saldo $${fm(S.cash)}</small></div></div><div class="scr pad"><h3 class="gold">Última rodada</h3>${tb(L)}<h3 class="gold" style="margin-top:14px">Acumulado da temporada</h3>${tb(Tt)}
<h3 class="gold" style="margin-top:14px">Patrocínios (${Object.values(S.sp).filter(Boolean).length}/5)</h3>${Object.keys(SPS).map(k=>{const x=S.sp[k];return `<div class="mi"><b>${SPS[k]}${k==='master'||k==='mat'?' • obrigatório':''}</b><div class="sm">${x?`${x.n} — $${fm(x.v)}/rodada + $${fm(x.w)} por vitória • ${x.y} temporada(s)`:'Vazio'}</div><div class="acts">${x?`<button data-a="spbr" data-k="${k}">Romper contrato</button>`:`<button class="p" data-a="spn" data-k="${k}">Negociar</button>`}</div></div>`}).join('')}
<h3 class="gold" style="margin-top:14px">Empréstimo bancário</h3><p class="sm">Valor</p><select data-c="lnm">${[5,10,20,40,80,120].map(x=>`<option value="${x}" ${LN.m===x?'selected':''}>$${x}M</option>`).join('')}</select><p class="sm" style="margin-top:8px">Prazo</p><select data-c="lnn">${LNT.map(([n,l])=>`<option value="${n}" ${LN.n===n?'selected':''}>${l}</option>`).join('')}</select><p class="sm" style="margin-top:8px">Juros: <b>${q.rate.toFixed(1)}%</b> • Total a pagar: <b>$${fm(q.tot)}</b> • Parcela: <b>$${fm(q.inst)}</b> por rodada</p><p class="sm mut">Quanto maior o valor e o prazo, maiores os juros.</p><button class="p" data-a="lnok">Contratar empréstimo</button>
<h3 class="gold" style="margin-top:14px">Estádio e ingressos</h3><p class="sm">Capacidade: ${S.cap.toLocaleString('pt-BR')} lugares • Torcida ${S.fan}%</p><button data-a="expand">Ampliar +5.000 ($${fm(4e6+S.cap*400)})</button><p style="margin-top:10px">Preço dos ingressos</p><select data-c="tkt">${op(['Baixo','Normal','Alto'],S.tkt)}</select><p style="margin-top:10px">Treinamento</p><select data-c="train">${op(['Físico','Técnico','Tático'],S.train)}</select>
<h3 class="gold" style="margin-top:14px">Dívidas e parcelas</h3>${S.debts.map(d=>`<p class="sm">${d.n}: $${fm(d.amt)} x ${d.left}</p>`).join('')||'<p class="sm mut">Nenhuma.</p>'}</div>`+tabs()}

function vNeg(){const p=DB.players.find(x=>x.id===NG.id),Ak=askP(p),card=`<div class="row" style="border-radius:8px"><div class="fl">${POS[p.position]}</div><div class="nm"><div>${p.name}</div><div>${T(p.teamId)?.name||''} • Overall ${p.overall}</div></div></div>`;
if(NG.step===2)return `<div class="top"><div><h1>Contrato do jogador</h1><small>Tentativa ${NG.tries2+1}/3</small></div></div><div class="scr pad">${card}<p class="mut sm" style="margin:10px 0">O empresário pede pelo menos <b>${agDem(p)}%</b> do salário base ($${fm(wage(p))}/mês).</p><label>Salário (% do base)</label><select data-c="agsal" style="width:100%">${[90,100,110,120,130,140,150].map(x=>`<option ${NG.sal===x?'selected':''}>${x}</option>`).join('')}</select><label style="display:block;margin-top:10px">Duração do contrato</label><select data-c="agyr" style="width:100%">${[1,2,3,4,5].map(x=>`<option value="${x}" ${NG.yrs===x?'selected':''}>${x} temporada${x>1?'s':''}</option>`).join('')}</select><p class="sm mut" style="margin-top:10px">Luvas: $${fm(wage(p)*3)} • Salário: $${fm(wage(p)*NG.sal/100)}/mês • Multa rescisória: $${fm(Ak*2.2)}</p>${NG.msg?`<p class="gold">${NG.msg}</p>`:''}<div class="acts"><button data-a="go" data-k="mkt">Desistir</button><button class="p" data-a="agsend">Propor contrato</button></div></div>`+tabs();
const loan=NG.ty==='e',fee=Math.round(Ak*(.04+.14*NG.dur/48)*NG.of/100),ofv=Math.round(Ak*NG.of/100);
return `<div class="top"><div><h1>Negociação com o clube</h1><small>${T(p.teamId)?.name||''} • tentativa ${NG.tries+1}/3</small></div></div><div class="scr pad">${card}<p style="margin:12px 0">Pedida do clube: <b>$${fm(Ak)}</b></p><label>Pagamento</label><select data-c="ngty" style="width:100%">${Object.entries(NGT).map(([k,l])=>`<option value="${k}" ${NG.ty===k?'selected':''}>${l}</option>`).join('')}</select>${loan?`<label style="display:block;margin-top:10px">Duração do empréstimo</label><select data-c="ngdur" style="width:100%">${LNT.map(([n,l])=>`<option value="${n}" ${NG.dur===n?'selected':''}>${l}</option>`).join('')}</select>`:''}<label style="display:block;margin-top:10px">${loan?'Taxa do empréstimo (% da base)':'Sua oferta (% do pedido)'}</label><select data-c="ngof" style="width:100%">${[70,75,80,85,90,95,100,105,110,120,130].map(x=>`<option ${NG.of===x?'selected':''}>${x}</option>`).join('')}</select><p class="sm mut" style="margin-top:10px">${loan?`Taxa: $${fm(fee)} • opção de compra ao fim: $${fm(Ak*.85)}`:`Pagamento inicial: $${fm(NG.ty==='v'?ofv:NG.ty==='p3'?ofv*.4:ofv*.25)}${NG.ty==='v'?'':' e o restante em parcelas semanais'}.`}</p>${NG.msg?`<p class="gold">${NG.msg}</p>`:''}<div class="acts"><button data-a="go" data-k="mkt">Cancelar</button><button class="p" data-a="ngsend">Enviar proposta</button></div></div>`+tabs()}
function deal(p,Ak){const ty=NG.ty,ofv=Math.round(Ak*NG.of/100),loan=ty==='e',lu=Math.round(wage(p)*3);let now=ofv,n=0;if(ty==='p3'){now=Math.round(ofv*.4);n=3}else if(ty==='p6'){now=Math.round(ofv*.25);n=6}else if(loan)now=Math.round(Ak*(.04+.14*NG.dur/48)*NG.of/100);
if(S.cash<now+lu)return say('Saldo insuficiente (pagamento inicial + luvas: $'+fm(now+lu)+').');if(S.pl.length>=30)return say('Elenco cheio (30).');S.cash-=now+lu;if(n)S.debts.push({n:'Parcelas de '+p.name,amt:Math.round((ofv-now)/n),left:n});
S.pl.push({...p,teamId:S.club,st:100,mor:80,fm:0,vm:1,bn:0,inj:0,loan:loan?1:0,lr:loan?NG.dur:0,opt:Math.round(Ak*.85),clause:Math.round(Ak*2.2),wm:NG.sal/100,yrs:NG.yrs});if(!S.manual)S.xi=assign(S.pl,S.form).map(x=>x.id);
mail('Contratação: '+p.name,{k:'info',txt:loan?'Chegou por empréstimo de '+LNT.find(x=>x[0]===NG.dur)[1]+'.':'Contrato de '+NG.yrs+' temporada(s) assinado. Multa rescisória: $'+fm(Ak*2.2)+'.'});NG=null;save();scr='mkt';render();say(p.name+' é o novo reforço!')}

function vCfg(){const yn=k=>`<select data-c="${k}"><option ${CFG[k]?'selected':''}>Sim</option><option ${!CFG[k]?'selected':''}>Não</option></select>`,sl=(k,l)=>`<p class="sm" style="margin-top:8px">${l}: ${CFG[k]}%</p><input type="range" min="0" max="100" value="${CFG[k]}" data-c="${k}" style="width:100%">`,op=(k,L)=>`<select data-c="${k}">${L.map(x=>`<option ${CFG[k]===x?'selected':''}>${x}</option>`).join('')}</select>`;
return `<div class="top"><h1>Opções</h1></div><div class="scr pad"><h3 class="gold">Som</h3><p class="sm">Som ligado</p>${yn('snd')}${sl('vol','Volume geral')}${sl('crowd','Torcida no estádio')}${sl('fx','Efeitos (cliques, gols, apito)')}
<h3 class="gold" style="margin-top:16px">Partida</h3><p class="sm">Duração (tempo real)</p><select data-c="mins">${[[10,'10 segundos'],[15,'15 segundos'],[20,'20 segundos'],[30,'30 segundos'],[45,'45 segundos'],[60,'1 minuto'],[120,'2 minutos'],[180,'3 minutos'],[300,'5 minutos'],[600,'10 minutos']].map(([n,l])=>`<option value="${n}" ${secs()===n?'selected':''}>${l}</option>`).join('')}</select><p class="sm" style="margin-top:8px">Pausar automaticamente após gol</p>${yn('pg')}<p class="sm" style="margin-top:8px">Narração lance a lance</p>${yn('log')}<p class="sm" style="margin-top:8px">Posse de bola e finalizações</p>${yn('stats')}<p class="sm" style="margin-top:8px">Dificuldade</p>${op('diff',['Fácil','Normal','Difícil'])}<p class="sm" style="margin-top:8px">Assistir às copas em que meu time não joga</p>${yn('spec')}
<h3 class="gold" style="margin-top:16px">Aparência</h3><p class="sm">Cor de destaque</p>${op('acc',['Dourado','Verde','Azul','Vermelho'])}<p class="sm" style="margin-top:8px">Tamanho do texto</p>${op('fs',['Pequena','Normal','Grande'])}<p class="sm" style="margin-top:8px">Escudos oficiais (pasta crests/)</p>${yn('crest')}
<h3 class="gold" style="margin-top:16px">Carreira</h3><div class="acts" style="flex-wrap:wrap"><button data-a="reg">Regulamentos</button><button data-a="resign">Pedir demissão</button><button data-a="menu">Menu de saves</button></div><div class="acts"><button data-a="exp">Exportar</button><button data-a="imp">Importar</button></div><input type="file" id="fi" hidden><p class="mut sm" style="margin-top:14px">Base de dados v${DB.databaseVersion} • Temporada ${S.season}</p></div>`+tabs()}
const REGX=[['Copa Intercontinental da FIFA (Mundial de Clubes)','Disputada todo ano entre 6 campeões continentais. 1ª fase: campeão da AFC x campeão da OFC. O vencedor enfrenta o campeão da CAF (Challenger Cup), depois o da CONCACAF e em seguida o da CONMEBOL (Derby das Américas). O vencedor final enfrenta o campeão da UEFA na final. Partidas únicas; empates decididos nos pênaltis.'],['Super Mundial de Clubes (a cada 4 anos)','32 clubes: 12 da UEFA, 6 da CONMEBOL, 4 da AFC, 4 da CAF, 4 da CONCACAF, 1 da OFC e 1 do país-sede. 8 grupos de 4 em turno único; os 2 melhores avançam. Oitavas, quartas, semifinais e final em jogo único. No jogo acontece nas temporadas 1, 5, 9...'],['Libertadores e Sul-Americana','16 clubes por edição, 4 grupos de 4 em ida e volta; os 2 melhores avançam; quartas e semifinais em ida e volta; final em jogo único.'],['Concacaf Champions Cup, AFC Champions League Elite e CAF Champions League','16 clubes em mata-mata: oitavas, quartas e semifinais em ida e volta; final em jogo único.'],['Copas nacionais (Copa do Brasil, FA Cup, Copa del Rey, Coppa Italia, DFB-Pokal, Coupe de France, Taça de Portugal, KNVB Beker e demais)','Mata-mata de jogo único com todos os clubes do país, de todas as divisões. Quando o total não é potência de 2, os clubes mais fortes entram direto em fases posteriores. Empates decididos nos pênaltis; a final é em estádio neutro tradicional (Maracanã, Wembley, Stade de France etc.).']];

Object.assign(A,{
slot(d){try{const s=JSON.parse(localStorage.getItem('mf_s_'+d.id));if(!s)return say('Save não encontrado.');if(s.dbv!==DB.databaseVersion)return say('Esse save é de uma versão antiga da base de dados.');S=s;S.pre=false;applyMv();scr=S.club?'squad':'un';render()}catch(e){say('Save inválido.')}},
delslot(d){ask('Apagar este save? Esta ação não pode ser desfeita.',()=>{try{localStorage.removeItem('mf_s_'+d.id);localStorage.setItem(META,JSON.stringify(metas().filter(m=>m.id!==d.id)))}catch(e){}render()})},
newgame(){ST={step:'cont'};scr='start';render()},
stb(){if(ST.step==='cont'){scr='slots'}else if(ST.step==='lg')ST={step:'cont'};else ST={step:'lg',c:ST.c};render()},
stc(d){ST={step:'lg',c:d.c};render()},stl(d){ST={step:'club',c:ST.c,l:d.l};render()},
pick(d){fresh(d.id,MGR.trim()||'Técnico');scr='squad';render()},
menu(){save();M=null;crowd(false);S=null;scr='slots';render()},
newg(){ask('Apagar este save e voltar ao menu?',()=>{try{localStorage.removeItem('mf_s_'+S.sid);localStorage.setItem(META,JSON.stringify(metas().filter(m=>m.id!==S.sid)))}catch(e){}S=null;scr='slots';render()})},
play(){if(!S.club)return A.unplay();let s;while((s=pendSer())&&!userFx(s)){if(CFG.spec&&s==='c')return startSpec('c');cupSilent(s)}if(S.round>=tot()&&!pendSer())return endSeason();s=pendSer();if(!(s&&userFx(s))&&!myPair()){quick();S.round++;roundEnd();save();render();return say('Seu clube folga nesta rodada.')}S.pre=true;scr='lineup';sel=null;render()},
unplay(){if(S.round>=tot())return unSeasonEnd();startSpec('L')},
sskip(){while(!M.done){M.paused=false;tickNoRender()}render()},
end(){if(M.spec)return endSpec();const cup=M.cup,C=M.comp;S.pl.forEach(p=>{p.st=Math.min(100,(p.st??100)+(cup?18:25));p.hurt=0});if(cup)(M.ser==='c'?S.cd++:S.nd++);else{S.round++;roundEnd()}M=null;crowd(false);save();scr='squad';render();
const next=()=>{if(cup&&C)return cupMsg(C);if(S.dir<=12)return fired();if(S.round>=tot()&&!pendSer())return endSeason();if(!cup&&Math.random()<.3)return saleOffer();offerMaybe()};playCel((S.cel||[]).splice(0),next)},
resign(){ask('Pedir demissão do '+club().name+'? Você ficará sem clube e poderá receber propostas de outros clubes a cada rodada.',()=>{S.fired=0;goUn()})},
sheet(d){S.sh=+d.i;scr='sheet';render()},refuse(){S.offers.splice(S.sh,1);scr=S.club?'squad':'un';render()},accept(){takeClub(S.offers[S.sh].club)},
roster(d){S.rs=d.id;scr='roster';render()},ltab(d){S.rs=d.id;scr='ltab';render()},shback(){scr='sheet';render()},
neg(d){NG={id:d.id,ty:'v',of:100,tries:0,msg:'',step:1,dur:12,tries2:0,sal:100,yrs:3};scr='neg';render()},
ngsend(){const p=DB.players.find(x=>x.id===NG.id),Ak=askP(p),th=.88+(hs(p.id+S.round)%10)/100,o=NG.of/100;NG.tries++;if(o>=th){NG.step=2;NG.msg='O clube aceitou! Agora negocie o contrato com o jogador.';return render()}
if(o>=th*.85&&NG.tries<3){NG.of=Math.min(130,Math.ceil(th*100/5)*5);NG.msg='Contraproposta do clube: '+NG.of+'%.';return render()}NG.msg=NG.tries>=3?'O clube encerrou a negociação.':'Proposta recusada. Tente outro valor.';if(NG.tries>=3){say(NG.msg);NG=null;scr='mkt'}render()},
agsend(){const p=DB.players.find(x=>x.id===NG.id),dem=agDem(p);NG.tries2++;if(NG.sal>=dem)return deal(p,askP(p));if(NG.sal>=dem-10&&NG.tries2<3){NG.sal=Math.min(150,Math.ceil(dem/10)*10);NG.msg='Contraproposta: o jogador aceita por '+NG.sal+'% do salário.';return render()}NG.msg=NG.tries2>=3?'O jogador desistiu da negociação.':'Proposta recusada. Aumente o salário.';if(NG.tries2>=3){say(NG.msg);NG=null;scr='mkt'}render()},

function promo(){const L=ctryLgs().filter(l=>grps(l).length===1),ids=l=>DB.teams.filter(t=>t.league===l).map(t=>t.id);L.sort((a,b)=>DB.leagueMeta[a].tier-DB.leagueMeta[b].tier);for(let i=0;i<L.length-1;i++){const u=L[i],d=L[i+1],k=Math.min(DB.leagueMeta[u].down,DB.leagueMeta[d].up);if(!k)continue;const su=tabSort(ids(u)),sd=tabSort(ids(d));su.slice(-k).forEach(id=>S.mv[id]=d);sd.slice(0,k).forEach(id=>S.mv[id]=u)}}
function unSeasonEnd(){const t1=ctryLgs().find(l=>(DB.leagueMeta[l]||{}).tier===1);if(t1)S.lastPos[ctry(t1)]=tabSort(DB.teams.filter(t=>t.league===t1).map(t=>t.id));promo();applyMv();DB.teams.forEach(t=>S.tab[t.id]=Z0());S.round=0;S.season++;genOffers(true);save();scr='un';render();say('Fim da temporada '+(S.season-1)+'. Uma nova temporada começa.')}
